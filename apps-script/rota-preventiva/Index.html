<!doctype html>
<html lang="pt-BR">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rota Preventiva | CPE / PMRv</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>
    :root{--navy:#0f172a;--gold:#c6ad62;--gold-dark:#aa9147;--paper:#f4f1e8;--ink:#18212f;--line:#d6d9df;--red:#a92828}
    *{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;font-family:Inter,"Segoe UI",Arial,sans-serif;color:var(--ink)}
    body{display:flex;overflow:hidden;background:var(--paper)}
    .sidebar{width:220px;flex:0 0 220px;background:#090e17;color:#f8fafc;padding:22px 14px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:4px 0 16px #0002;z-index:500}
    .sidebar-title{font-size:.68rem;letter-spacing:.15em;text-transform:uppercase;color:#929daf;font-weight:800;padding:0 9px;margin:4px 0 22px}
    .menu-nav{display:grid;gap:7px}.menu-btn{display:flex;align-items:center;gap:11px;text-align:left;padding:12px 13px;border:0;border-radius:8px;background:transparent;color:#c5ced9;font-size:.85rem;font-weight:650;cursor:pointer}.menu-btn.active{background:var(--gold);color:#111827}.menu-btn span.icon{width:17px;text-align:center;font-size:1rem}.btn-sair{border:1px solid #384154}
    .main-wrapper{min-width:0;flex:1;height:100%;display:flex;flex-direction:column}
    .header-cpe{height:112px;min-height:112px;display:flex;align-items:center;justify-content:space-between;gap:15px;padding:0 24px;background:#090e17;color:#fff;box-shadow:0 3px 9px #0003;z-index:400}
    .badge-frame{height:104px;width:92px;flex:0 0 92px;display:flex;align-items:center;justify-content:center}.badge-frame img{height:100%;width:100%;object-fit:contain;filter:drop-shadow(0 2px 4px #0008)}
    .header-info h1{font-size:1.5rem;line-height:1.1;margin:0 0 4px;font-weight:800;letter-spacing:.01em}.header-info p{font-size:.74rem;color:#d9c889;letter-spacing:.09em;text-transform:uppercase;font-weight:750;margin:0}
    .controls-panel{display:grid;grid-template-columns:repeat(5,minmax(120px,1fr));gap:10px;align-items:end;padding:12px 17px;background:#fff;border-bottom:1px solid var(--line);box-shadow:0 2px 7px #0000000d;z-index:300}
    .form-group label{display:block;margin:0 0 5px;font-size:.65rem;font-weight:800;color:#526071;text-transform:uppercase;letter-spacing:.04em}
    select,input[type=number],input[type=range]{width:100%;height:34px;padding:5px 8px;border:1px solid #ccd2db;border-radius:6px;background:#fbfcfd;color:#18212f;font:inherit;font-size:.78rem;min-width:0}
    select.active-filter{border-color:var(--gold-dark);background:#fbf6e6;font-weight:700}
    input[type=range]{padding:0;accent-color:var(--gold-dark)}.range-label{font-size:.72rem;color:#6a7482;font-weight:700}
    .btn-action{width:100%;height:35px;background:var(--gold);border:0;border-radius:6px;color:#111827;font-weight:800;font-size:.81rem;cursor:pointer}.btn-action:hover{background:#b79d50}.btn-action:disabled{opacity:.6;cursor:wait}
    .btn-clear{width:100%;height:35px;background:#fff;border:1px solid #ccd2db;border-radius:6px;color:#526071;font-weight:750;font-size:.78rem;cursor:pointer}
    .nav-links{display:flex;gap:6px}.btn-nav-map{display:none;flex:1;text-align:center;padding:9px 5px;border-radius:6px;color:#fff;text-decoration:none;font-size:.7rem;font-weight:800;white-space:nowrap}.btn-gmaps{background:#16834a}.btn-waze{background:#087cad}
    .notice{display:none;padding:8px 17px;background:#fff7e0;border-bottom:1px solid #ecd9a0;color:#6b5210;font-size:.76rem;line-height:1.45}.notice strong{color:#4a3808}
    .summary{display:none;gap:18px;flex-wrap:wrap;padding:7px 17px;background:#f9fafb;border-bottom:1px solid var(--line);font-size:.75rem;color:#526071}.summary b{color:var(--navy)}
    .map-wrap{position:relative;flex:1;min-height:0}#map{position:absolute;inset:0;background:#e8e5db}
    .leaflet-popup-content{margin:12px 14px}.popup-card{min-width:210px;font-size:12px;line-height:1.6}.popup-card h4{margin:0 0 6px;color:var(--navy);font-size:14px}.popup-card strong{color:#354258}.popup-note{margin-top:7px;padding-top:6px;border-top:1px solid #ddd;color:#9b2424;font-weight:750}
    .rank-icon{background:var(--red);color:#fff;border:2px solid #fff;border-radius:50%;font:800 11px/20px Arial,sans-serif;text-align:center;box-shadow:0 1px 4px #0007}
    /* Ampulheta de carregamento */
    #loadingOverlay{position:fixed;inset:0;z-index:2000;background:#0f172ae6;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#e0cb83;font-weight:750;text-align:center;padding:20px;gap:16px}
    .hourglass{width:54px;height:80px;animation:flip 2.4s ease-in-out infinite}
    .hourglass .sand-top{animation:drainTop 2.4s linear infinite;transform-origin:50% 38px}
    .hourglass .sand-bot{animation:fillBot 2.4s linear infinite;transform-origin:50% 72px}
    .hourglass .stream{animation:stream 2.4s linear infinite}
    @keyframes flip{0%,80%{transform:rotate(0)}100%{transform:rotate(180deg)}}
    @keyframes drainTop{0%{transform:scaleY(1)}80%,100%{transform:scaleY(0)}}
    @keyframes fillBot{0%{transform:scaleY(0)}80%,100%{transform:scaleY(1)}}
    @keyframes stream{0%,78%{opacity:1}80%,100%{opacity:0}}
    @media (prefers-reduced-motion:reduce){.hourglass,.hourglass *{animation-duration:6s}}
    @media(max-width:1100px){.controls-panel{grid-template-columns:repeat(3,minmax(120px,1fr))}.nav-links{min-height:35px}}
    @media(max-width:720px){.sidebar{width:57px;flex-basis:57px;padding:14px 6px}.sidebar-title{display:none}.menu-btn{justify-content:center;padding:12px 4px;font-size:0}.menu-btn span.icon{font-size:1rem}.btn-sair{font-size:0}.header-cpe{height:84px;min-height:84px;padding:0 12px}.badge-frame{height:78px;width:68px;flex-basis:68px}.header-info h1{font-size:1.15rem}.header-info p{font-size:.56rem}.controls-panel{grid-template-columns:repeat(2,minmax(110px,1fr));gap:8px;padding:9px}.form-group label{font-size:.59rem}.nav-links{grid-column:span 2}.nav-links .btn-nav-map{font-size:.74rem}}
  </style>
</head>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    'use strict';
    let map, markersLayer, routeLayer;
    const $ = id => document.getElementById(id);
    const FILTERS = [
      ['selectRpm','rpms','Todas as RPMs','rpm'],
      ['selectCia','cias','Todas as Cias','cia'],
      ['selectPelotao','pelotoes','Todos os Pelotões','pelotao'],
      ['selectGrupamento','grupamentos','Todos os Grupamentos','grupamento'],
      ['selectCidade','cidades','Todos os Municípios','cidade']
    ];
    let busy = 0;
    function loading(show, message) {
      busy = Math.max(0, busy + (show ? 1 : -1));
      if (message) $('loadingText').textContent = message;
      $('loadingOverlay').style.display = busy ? 'flex' : 'none';
    }
    function escapeHtml(v) { return String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
    function notice(html) { const n=$('notice'); n.innerHTML=html||''; n.style.display=html?'block':'none'; }
    // Rede de segurança: nunca exibir código interno (ex.: 2020-017737686-001 / 310010).
    function isOpaque(s) { return /^\d{4,}$/.test(s) || /^\d[\d.\-\/]{5,}$/.test(s) || /^[A-Za-z0-9]+(?:[-_/][A-Za-z0-9]+){2,}$/.test(s); }

    function initMap() {
      if (!window.L) { alert('Não foi possível carregar a biblioteca do mapa. Verifique a conexão e atualize a página.'); return false; }
      map = L.map('map', {preferCanvas:true}).setView([-18.5,-44.5],6); // Minas Gerais
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);
      markersLayer = L.featureGroup().addTo(map);
      routeLayer = L.featureGroup().addTo(map);
      return true;
    }
    function fillOptions(id, list, allText) {
      const select = $(id); select.replaceChildren(new Option(allText,'TODOS'));
      const seen = new Set();
      (Array.isArray(list) ? list : []).forEach(item => {
        const label = String(item && typeof item === 'object' ? item.nome : item || '').trim();
        if (!label || isOpaque(label)) return;
        const key = label.normalize('NFD').replace(/[̀-ͯ]/g,'').toLocaleLowerCase('pt-BR').replace(/\s+/g,' ');
        if (seen.has(key)) return;
        seen.add(key); select.add(new Option(label,label));
      });
      select.disabled = select.options.length <= 1;
      select.title = select.disabled ? 'Nenhuma opção encontrada na planilha' : '';
    }
    function loadFilters() {
      loading(true,'Carregando opções de filtros...');
      google.script.run.withSuccessHandler(res => {
        res = res || {};
        FILTERS.forEach(f => fillOptions(f[0], res[f[1]], f[2]));
        const avisos = Array.isArray(res.avisos) ? res.avisos : [];
        const vazios = FILTERS.filter(f => $(f[0]).disabled).map(f => f[2].replace(/^Tod[oa]s (as|os) /,''));
        if (avisos.length || vazios.length) {
          notice('<strong>Atenção:</strong> ' + (vazios.length ? 'sem opções para ' + escapeHtml(vazios.join(', ')) + '. ' : '') +
            avisos.map(a => '<div>• ' + escapeHtml(a) + '</div>').join(''));
        }
        loading(false);
      }).withFailureHandler(err => { loading(false); notice('<strong>Falha ao carregar filtros:</strong> ' + escapeHtml(err && err.message || err)); }).getDadosCompletosFiltros();
    }
    function parseTimeWindow() {
      const value = $('selectTurno').value;
      if (value === 'TODOS') return {start:null,end:null};
      if (value === 'CUSTOM') {
        const start = Number($('horaIni').value), end = Number($('horaFim').value);
        if (!Number.isInteger(start)||!Number.isInteger(end)||start<0||start>23||end<0||end>23) throw new Error('Informe horários válidos entre 0 e 23.');
        return {start,end};
      }
      const parts = value.split('-'); return {start:Number(parts[0]),end:Number(parts[1])};
    }
    function processRoute() {
      let time; try { time = parseTimeWindow(); } catch(e) { alert(e.message); return; }
      const params = {raioDensidade:Number($('rangeRaio').value),horaInicio:time.start,horaFim:time.end};
      FILTERS.forEach(f => params[f[3]] = $(f[0]).value); // filtros independentes: cada um vai como está
      loading(true,'Calculando hotspots e ajustando o mapa...'); $('btnGerar').disabled = true;
      google.script.run
        .withSuccessHandler(res => { $('btnGerar').disabled=false; loading(false); renderResults(res); })
        .withFailureHandler(err => { $('btnGerar').disabled=false; loading(false); alert('Falha ao calcular a rota: '+(err&&err.message||err)); })
        .calcularRotaAvancada(params);
    }
    function describeSelection() {
      const s = FILTERS.map(f => $(f[0]).value).filter(v => v !== 'TODOS');
      return s.length ? s.join(' · ') : 'Todo o CPE';
    }
    function renderResults(res) {
      markersLayer.clearLayers(); routeLayer.clearLayers();
      $('btnGmaps').style.display='none'; $('btnWaze').style.display='none';
      const points = res && Array.isArray(res.hotspots) ? res.hotspots : [];
      const sum = $('summary');
      if (!points.length) { sum.style.display='none'; alert('Nenhum ponto de risco encontrado para os filtros selecionados.'); return; }
      const radius = Number($('rangeRaio').value);
      points.forEach((p,i) => {
        const popup = '<div class="popup-card"><h4>Ponto Preditivo #'+(i+1)+'</h4>'+
          '<strong>Rodovia:</strong> '+escapeHtml(p.rodovia||'N/D')+'<br>'+
          '<strong>Cidade:</strong> '+escapeHtml(p.cidade||'N/D')+'<br>'+
          '<strong>Fração responsável:</strong> '+escapeHtml(p.fracao||'PMRv')+'<br>'+
          '<strong>Escore de Risco:</strong> '+(Number.isFinite(Number(p.escore))?Number(p.escore).toFixed(1):'N/D')+'<br>'+
          '<strong>Volume STV:</strong> '+(Number(p.qtd)||0)+
          '<div class="popup-note">Patrulhamento preventivo orientado</div></div>';
        const top = i < 10;
        L.circle([p.lat,p.lng],{color:top?'#a92828':'#c2410c',fillColor:top?'#e64b4b':'#f59e0b',fillOpacity:top?.45:.28,weight:top?2:1,radius:Number(p.raio)||radius})
          .bindPopup(popup).addTo(markersLayer);
        if (top) L.marker([p.lat,p.lng],{icon:L.divIcon({className:'rank-icon',html:String(i+1),iconSize:[24,24]})}).bindPopup(popup).addTo(markersLayer);
      });
      if (Array.isArray(res.rota) && res.rota.length > 1)
        L.polyline(res.rota,{color:'#0f172a',weight:3,opacity:.75,dashArray:'8 6'}).addTo(routeLayer);
      // Enquadra toda a área dos registros filtrados (área territorial da fração/município).
      let bounds = res.bounds ? L.latLngBounds(res.bounds) : null;
      if (!bounds || !bounds.isValid()) bounds = markersLayer.getBounds();
      if (bounds.isValid()) map.fitBounds(bounds.pad(0.05),{padding:[30,30],maxZoom:14});
      if (res.linkMaps) { $('btnGmaps').href=res.linkMaps; $('btnGmaps').style.display='block'; }
      if (res.linkWaze) { $('btnWaze').href=res.linkWaze; $('btnWaze').style.display='block'; }
      sum.innerHTML = '<span>Área: <b>'+escapeHtml(describeSelection())+'</b></span>'+
        '<span>Registros STV: <b>'+(Number(res.totalRegistros)||0).toLocaleString('pt-BR')+'</b></span>'+
        '<span>Hotspots: <b>'+(Number(res.totalHotspots)||points.length).toLocaleString('pt-BR')+'</b>'+
        (res.totalHotspots>points.length?' (exibindo os '+points.length+' mais críticos)':'')+'</span>'+
        '<span>Rota: <b>'+(res.rota?res.rota.length:0)+' pontos</b></span>';
      sum.style.display='flex';
    }
    function clearFilters() {
      FILTERS.forEach(f => { $(f[0]).value='TODOS'; $(f[0]).classList.remove('active-filter'); });
      $('selectTurno').value='TODOS'; $('divCustomHora').hidden=true;
    }
    FILTERS.forEach(f => $(f[0]).addEventListener('change', e => e.target.classList.toggle('active-filter', e.target.value!=='TODOS')));
    $('rangeRaio').addEventListener('input',e=>$('lblRaio').textContent=e.target.value+' m');
    $('selectTurno').addEventListener('change',e=>{$('divCustomHora').hidden=e.target.value!=='CUSTOM';});
    $('btnGerar').addEventListener('click',processRoute);
    $('btnLimpar').addEventListener('click',clearFilters);
    window.addEventListener('load',()=>{ if(initMap()) loadFilters(); else $('loadingOverlay').style.display='none'; });
  </script>
</body>
</html>
