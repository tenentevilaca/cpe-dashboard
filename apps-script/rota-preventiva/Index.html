<!doctype html>
<html lang="pt-BR">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rota Preventiva | CPE / PMRv</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>
    :root{--navy:#0f172a;--black:#090e17;--gold:#c6ad62;--gold-dark:#aa9147;--paper:#f4f1e8;--ink:#18212f;--line:#d6d9df;--muted:#526071;--red:#a92828;--blue:#1d4ed8}
    *{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;font-family:Inter,"Segoe UI",Arial,sans-serif;color:var(--ink)}
    body{display:flex;overflow:hidden;background:var(--paper)}
    button{font:inherit}
    /* Barra lateral preta com o escudo ocupando toda a largura */
    .sidebar{width:200px;flex:0 0 200px;background:var(--black);color:#f8fafc;display:flex;flex-direction:column;box-shadow:4px 0 16px #0002;z-index:600;overflow-y:auto}
    .brand{padding:14px 12px 10px}.brand img{display:block;width:100%;height:auto;filter:drop-shadow(0 3px 6px #000a)}
    .brand-caption{margin-top:8px;text-align:center;font-size:.62rem;letter-spacing:.14em;text-transform:uppercase;color:#d9c889;font-weight:800}
    .menu-nav{display:grid;gap:6px;padding:8px 10px}.menu-btn{display:flex;align-items:center;gap:10px;text-align:left;padding:10px 12px;border:0;border-radius:8px;background:transparent;color:#c5ced9;font-size:.82rem;font-weight:650;cursor:pointer}.menu-btn.active{background:var(--gold);color:#111827}.menu-btn .icon{width:17px;text-align:center}
    .main-wrapper{min-width:0;flex:1;height:100%;display:flex;flex-direction:column}
    /* Faixa superior: título + régua de densidade espacial */
    .header-cpe{display:flex;align-items:center;justify-content:space-between;gap:18px;padding:10px 20px;background:var(--black);color:#fff;box-shadow:0 3px 9px #0003;z-index:500;flex-wrap:wrap}
    .header-info h1{font-size:1.45rem;line-height:1.1;margin:0 0 3px;font-weight:800}.header-info p{font-size:.72rem;color:#d9c889;letter-spacing:.09em;text-transform:uppercase;font-weight:750;margin:0}
    .ruler{flex:1;max-width:560px;min-width:260px;color:#e5e7eb}
    .ruler-top{display:flex;justify-content:space-between;align-items:baseline;font-size:.68rem;text-transform:uppercase;letter-spacing:.06em;font-weight:800;color:#cbd5e1}
    .ruler-top output{font-size:.95rem;color:var(--gold);letter-spacing:0}
    .ruler input{width:100%;margin:4px 0 0;accent-color:var(--gold)}
    .ticks{position:relative;height:16px;border-top:1px solid #475569;margin:0 8px}
    .ticks span{position:absolute;top:0;transform:translateX(-50%);white-space:nowrap;font-size:.6rem;color:#94a3b8;padding-top:4px}
    .ticks span::before{content:"";position:absolute;left:50%;top:-1px;width:1px;height:5px;background:#94a3b8}
    .ruler-hint{font-size:.62rem;color:#94a3b8;display:flex;justify-content:space-between;margin-top:3px;gap:8px}
    /* Filtros */
    .controls-panel{display:grid;grid-template-columns:repeat(6,minmax(128px,1fr));gap:9px 10px;align-items:end;padding:10px 16px;background:#fff;border-bottom:1px solid var(--line);box-shadow:0 2px 7px #0000000d;z-index:400}
    .form-group label,.group-title{display:block;margin:0 0 4px;font-size:.62rem;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
    select,input[type=number]{width:100%;height:33px;padding:4px 8px;border:1px solid #ccd2db;border-radius:6px;background:#fbfcfd;color:var(--ink);font:inherit;font-size:.78rem;min-width:0}
    select:disabled{opacity:.55}
    select.active-filter{border-color:var(--gold-dark);background:#fbf6e6;font-weight:700}
    .time-range{display:flex;gap:5px;align-items:center;font-size:.72rem;color:var(--muted)}
    .checks{display:flex;flex-direction:column;gap:3px;font-size:.74rem;color:var(--ink)}
    .checks label{display:flex;flex-wrap:wrap;gap:4px 6px;align-items:center;cursor:pointer;text-transform:none;letter-spacing:0;font-weight:600;font-size:.74rem;color:var(--ink);margin:0}
    .checks select{height:24px;width:auto;padding:0 4px;font-size:.72rem}
    .btn-action{width:100%;height:34px;background:var(--gold);border:0;border-radius:6px;color:#111827;font-weight:800;font-size:.81rem;cursor:pointer}.btn-action:hover{background:#b79d50}.btn-action:disabled{opacity:.6;cursor:wait}
    .btn-pair{display:flex;gap:6px}.btn-clear{flex:0 0 auto;width:auto;padding:0 10px;height:34px;background:#fff;border:1px solid #ccd2db;border-radius:6px;color:var(--muted);font-weight:750;font-size:.78rem;cursor:pointer}
    .span2{grid-column:span 2}
    .btn-filtros{display:none;border:1px solid #475569;background:transparent;color:#e5e7eb;border-radius:6px;padding:6px 10px;font-weight:800;font-size:.72rem;cursor:pointer}
    .notice{display:none;position:relative;padding:7px 40px 7px 16px;background:#fff7e0;border-bottom:1px solid #ecd9a0;color:#6b5210;font-size:.74rem;line-height:1.45;max-height:150px;overflow:auto}
    .notice details{margin-top:3px}.notice summary{cursor:pointer;font-weight:700}.notice .x{position:absolute;right:10px;top:5px;border:0;background:transparent;font-size:1rem;cursor:pointer;color:#6b5210}
    .seg{padding:6px 8px;border-left:4px solid var(--gold);background:#faf7ee;margin:4px 0;border-radius:4px}.notice strong{color:#4a3808}
    .summary{display:none;gap:16px;flex-wrap:wrap;padding:6px 16px;background:#f9fafb;border-bottom:1px solid var(--line);font-size:.74rem;color:var(--muted)}.summary b{color:var(--navy)}
    /* Mapa + painel lateral */
    .map-wrap{position:relative;flex:1;min-height:0}#map{position:absolute;inset:0;background:#e8e5db}
    .panel{position:absolute;top:10px;right:10px;bottom:10px;width:350px;max-width:calc(100% - 20px);background:#fff;border-radius:10px;box-shadow:0 6px 24px #0003;z-index:450;display:none;flex-direction:column;overflow:hidden}
    .panel.open{display:flex}
    .panel-tabs{display:flex;border-bottom:1px solid var(--line);background:#f8fafc}
    .panel-tabs button{flex:1;padding:9px 6px;border:0;background:transparent;font-weight:800;font-size:.75rem;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent}
    .panel-tabs button.active{color:var(--navy);border-bottom-color:var(--gold)}
    .panel-tabs .close{flex:0 0 38px;font-size:1rem}
    .panel-body{flex:1;overflow:auto;padding:12px 14px;font-size:.78rem;line-height:1.5}
    .panel-body h3{margin:0 0 2px;font-size:1rem;color:var(--navy)}.panel-body h4{margin:12px 0 5px;font-size:.7rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
    .kv{display:grid;grid-template-columns:auto 1fr;gap:2px 10px}.kv dt{color:var(--muted);font-weight:700}.kv dd{margin:0;font-weight:650}
    .hours{display:flex;align-items:flex-end;gap:2px;height:52px;border-bottom:1px solid var(--line)}.hours div{flex:1;background:#94a3b8;min-height:1px;border-radius:2px 2px 0 0}.hours div.peak{background:var(--red)}
    .hours-axis{display:flex;justify-content:space-between;font-size:.6rem;color:var(--muted)}
    .btn-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
    .btn-sm{padding:6px 9px;border-radius:6px;border:0;font-weight:800;font-size:.7rem;cursor:pointer;text-decoration:none;color:#fff;background:var(--navy);display:inline-block}
    .btn-sm.gm{background:#16834a}.btn-sm.wz{background:#087cad}.btn-sm.alt{background:#7c3aed}.btn-sm.ghost{background:#fff;color:var(--navy);border:1px solid var(--line)}
    .stop{display:grid;grid-template-columns:26px 1fr auto;gap:8px;align-items:start;padding:7px 0;border-bottom:1px dashed var(--line)}
    .stop .num{width:24px;height:24px;border-radius:50%;background:var(--blue);color:#fff;font-weight:800;font-size:.72rem;display:flex;align-items:center;justify-content:center}
    .stop.done .num{background:#16a34a}.stop.next .num{outline:3px solid #facc15}
    .stop small{color:var(--muted)}
    .alert-item{padding:5px 8px;border-left:4px solid #f59e0b;background:#fffbeb;margin:4px 0;border-radius:4px}.alert-item.closed{border-color:#dc2626;background:#fef2f2}
    .alt-route{padding:6px 8px;border-radius:6px;margin:4px 0;border:2px solid;cursor:pointer}
    .muted{color:var(--muted)}
    .legend{background:#fff;padding:7px 9px;border-radius:8px;box-shadow:0 2px 8px #0003;font-size:.68rem;line-height:1.5}.legend i{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:5px;vertical-align:-1px}
    .leaflet-popup-content{margin:11px 13px}.popup-card{min-width:210px;font-size:12px;line-height:1.55}.popup-card h4{margin:0 0 5px;color:var(--navy);font-size:14px}.popup-card strong{color:#354258}.popup-note{margin-top:6px;padding-top:5px;border-top:1px solid #ddd;color:#9b2424;font-weight:750}
    .rank-icon{background:var(--red);color:#fff;border:2px solid #fff;border-radius:50%;font:800 11px/20px Arial,sans-serif;text-align:center;box-shadow:0 1px 4px #0007}
    .stop-icon{background:var(--blue);color:#fff;border:2px solid #fff;border-radius:6px;font:800 11px/20px Arial,sans-serif;text-align:center;box-shadow:0 1px 4px #0007}
    .alert-icon{font-size:18px;line-height:22px;text-align:center;filter:drop-shadow(0 1px 2px #0008)}
    .gps-icon{background:#2563eb;border:3px solid #fff;border-radius:50%;box-shadow:0 0 0 6px #2563eb44}
    .fab{position:absolute;left:10px;top:112px;z-index:440;display:flex;flex-direction:column;gap:6px}
    .fab button{padding:8px 11px;border-radius:8px;border:0;background:#fff;box-shadow:0 2px 8px #0003;font-weight:800;font-size:.72rem;cursor:pointer;color:var(--navy)}
    .fab button.on{background:#2563eb;color:#fff}
    /* Ampulheta */
    #loadingOverlay{position:fixed;inset:0;z-index:2000;background:#0f172ae6;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#e0cb83;font-weight:750;text-align:center;padding:20px;gap:16px}
    .hourglass{width:54px;height:80px;animation:flip 2.4s ease-in-out infinite}
    .hourglass .sand-top{animation:drainTop 2.4s linear infinite;transform-origin:50% 38px}
    .hourglass .sand-bot{animation:fillBot 2.4s linear infinite;transform-origin:50% 72px}
    .hourglass .stream{animation:stream 2.4s linear infinite}
    @keyframes flip{0%,80%{transform:rotate(0)}100%{transform:rotate(180deg)}}
    @keyframes drainTop{0%{transform:scaleY(1)}80%,100%{transform:scaleY(0)}}
    @keyframes fillBot{0%{transform:scaleY(0)}80%,100%{transform:scaleY(1)}}
    @keyframes stream{0%,78%{opacity:1}80%,100%{opacity:0}}
    @media(max-width:1250px){.controls-panel{grid-template-columns:repeat(4,minmax(120px,1fr))}}
    @media(max-width:820px){
      .sidebar{width:64px;flex-basis:64px}.brand{padding:8px 6px}.brand-caption,.menu-btn .label{display:none}.menu-btn{justify-content:center;padding:10px 4px}
      .header-cpe{padding:8px 12px}.header-info h1{font-size:1.1rem}.header-info p{font-size:.56rem}.ruler{min-width:100%}
      .controls-panel{grid-template-columns:repeat(2,minmax(110px,1fr));gap:7px;padding:8px;max-height:60vh;overflow:auto}.controls-panel.collapsed{display:none}.span2{grid-column:span 2}
      .btn-filtros{display:inline-block}.summary{gap:2px 12px;font-size:.68rem;padding:5px 10px}.ruler-top span{font-size:.6rem}.ruler-hint{display:none}.fab{top:122px}
      .panel{top:auto;height:55%;width:auto;left:10px}
    }
  </style>
</head>

        <input type="range" id="rangeRaio" min="0" max="1000" step="1" value="500" aria-label="Raio do cluster">
        <div class="ticks" id="ticks"></div>
        <div class="ruler-hint"><span>◀ aproxima (mais pontos, menores)</span><span>afasta (menos pontos, maiores) ▶</span></div>
      </div>
    </header>

    <section class="controls-panel" id="controls" aria-label="Filtros da rota">
      <div class="form-group"><label for="selectRpm">RPM</label><select id="selectRpm"></select></div>
      <div class="form-group"><label for="selectCia">Companhia (Cia)</label><select id="selectCia"></select></div>
      <div class="form-group"><label for="selectPelotao">Pelotão</label><select id="selectPelotao"></select></div>
      <div class="form-group"><label for="selectGrupamento">Grupamento</label><select id="selectGrupamento"></select></div>
      <div class="form-group"><label for="selectCidade">Município / Cidade</label><select id="selectCidade"></select></div>
      <div class="form-group">
        <label for="selectTurno">Horário</label>
        <select id="selectTurno">
          <option value="TODOS">24 horas (sem filtro)</option>
          <option value="AUTO">Automático (turno atual)</option>
          <option value="01-07">Madrugada (01h–07h)</option>
          <option value="07-13">Manhã (07h–13h)</option>
          <option value="13-19">Tarde (13h–19h)</option>
          <option value="19-01">Noite (19h–01h)</option>
          <option value="CUSTOM">Período específico…</option>
        </select>
      </div>
      <div class="form-group" id="divCustomHora" hidden>
        <label>Da hora … até a hora</label>
        <div class="time-range"><select id="horaIni" aria-label="Hora inicial"></select><span>até</span><select id="horaFim" aria-label="Hora final"></select></div>
      </div>
      <div class="form-group span2">
        <span class="group-title">Ponderação do escore</span>
        <div class="checks">
          <label><input type="checkbox" id="chkGravidade" checked> Gravidade × volume de registros STV</label>
          <label><input type="checkbox" id="chkRecente" checked> Ponderação recente (w₂₀₂₆ = <span id="lblPeso">0,6</span>) nos últimos
            <select id="selJanela"><option value="0">30</option><option value="1">60</option><option value="2" selected>90</option></select> dias</label>
        </div>
      </div>
      <div class="form-group"><label for="selectOrigem">Início da rota</label>
        <select id="selectOrigem"><option value="SEDE">Sede da fração</option><option value="GPS">Minha localização (GPS)</option><option value="TOPO">Ponto mais crítico</option></select></div>
      <div class="form-group"><label for="selectPontos">Pontos na rota</label>
        <select id="selectPontos"><option>5</option><option>8</option><option selected>10</option><option>15</option><option>20</option><option>23</option></select></div>
      <div class="form-group"><label for="selectKm">Extensão máxima</label>
        <select id="selectKm"><option value="0">Sem limite</option><option value="60">60 km</option><option value="100">100 km</option><option value="150" selected>150 km</option><option value="200">200 km</option><option value="300">300 km</option></select></div>
      <div class="form-group"><label>&nbsp;</label><div class="btn-pair"><button class="btn-action" id="btnGerar" type="button">Gerar rota preventiva</button><button class="btn-clear" id="btnLimpar" type="button" title="Limpar filtros">⟲ Limpar</button></div></div>
    </section>
    <div id="notice" class="notice" role="note"></div>
    <div id="summary" class="summary" aria-live="polite"></div>

    <div class="map-wrap">
      <div id="map" aria-label="Mapa de pontos preditivos"></div>
      <div class="fab">
        <button type="button" id="btnGps" title="Mostrar minha posição e acompanhar a rota">📍 GPS</button>
        <button type="button" id="btnPainel" title="Abrir painel">☰ Painel</button>
      </div>
      <aside class="panel" id="panel" aria-label="Informações">
        <div class="panel-tabs">
          <button type="button" data-tab="trecho" class="active">Cartão do trecho</button>
          <button type="button" data-tab="rota">Rota</button>
          <button type="button" data-tab="alertas">Alertas</button>
          <button type="button" class="close" id="btnFechar" aria-label="Fechar">✕</button>
        </div>
        <div class="panel-body" id="panelBody"></div>
      </aside>
    </div>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    'use strict';
    const $ = id => document.getElementById(id);
    const LEVELS = ['rpm','cia','pelotao','grupamento','cidade'];
    const SEL = {rpm:'selectRpm',cia:'selectCia',pelotao:'selectPelotao',grupamento:'selectGrupamento',cidade:'selectCidade'};
    const ALL = {rpm:'Todas as RPMs',cia:'Todas as Cias',pelotao:'Todos os Pelotões',grupamento:'Todos os Grupamentos',cidade:'Todos os Municípios'};
    const JOIN = ' › ';
    const IS_MOBILE = /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent);
    const RADII = [100,150,200,300,500,750,1000,1500,2000,3000,5000,7500,10000];
    const TURNOS = [['01-07','Madrugada',1,7],['07-13','Manhã',7,13],['13-19','Tarde',13,19],['19-01','Noite',19,1]];

    let TUPLAS = [], PESOS = {recente:.6, historico:.4};
    let map, L_clusters, L_route, L_access, L_alerts, L_gps;
    let RESULT = null, CLUSTERS = [], ROUTE = null, ALERTS = {alertas:[], congestionamentos:[], fontes:[]}, CURRENT = null;
    const GPS = {watch:null, pos:null, marker:null, visited:new Set()};
    let busy = 0, tab = 'trecho';

    /* ---------- utilidades ---------- */
    function loading(show, msg) { busy = Math.max(0, busy + (show ? 1 : -1)); if (msg) $('loadingText').textContent = msg; $('loadingOverlay').style.display = busy ? 'flex' : 'none'; }
    function esc(v) { return String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
    function norm(s) { return String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/\s+/g,' ').trim(); }
    function fmt(n, d) { return Number(n||0).toLocaleString('pt-BR',{minimumFractionDigits:d||0,maximumFractionDigits:d||0}); }
    function km(m) { return m >= 1000 ? fmt(m/1000, m%1000?1:0)+' km' : fmt(m)+' m'; }
    function minTxt(m) { m = Math.round(m); return m >= 60 ? Math.floor(m/60)+' h '+String(m%60).padStart(2,'0')+' min' : m+' min'; }
    function hav(a, b) { const R=6371000, r=Math.PI/180, dLa=(b[0]-a[0])*r, dLo=(b[1]-a[1])*r; const x=Math.sin(dLa/2)**2+Math.cos(a[0]*r)*Math.cos(b[0]*r)*Math.sin(dLo/2)**2; return 2*R*Math.asin(Math.sqrt(x)); }
    function notice(html) { const n=$('notice'); n.innerHTML=html||''; n.style.display=html?'block':'none'; }
    function run(fn, arg) { return new Promise((ok, fail) => google.script.run.withSuccessHandler(ok).withFailureHandler(fail)[fn](arg)); }

    /* ---------- régua de densidade (escala logarítmica) ---------- */
    function sliderToMeters(v) { const lo=Math.log(100), hi=Math.log(10000); const m=Math.exp(lo+(hi-lo)*v/1000); return m<1000 ? Math.round(m/10)*10 : Math.round(m/50)*50; }
    function metersToSlider(m) { const lo=Math.log(100), hi=Math.log(10000); return Math.round((Math.log(m)-lo)/(hi-lo)*1000); }
    function radius() { return sliderToMeters(Number($('rangeRaio').value)); }
    function buildTicks() { const t=$('ticks'); [100,250,500,1000,2500,5000,10000].forEach(m => { const s=document.createElement('span'); s.style.left=(metersToSlider(m)/10)+'%'; s.textContent=km(m); t.appendChild(s); }); }

    /* ---------- mapa ---------- */
    function initMap() {
      if (!window.L) { alert('Não foi possível carregar a biblioteca do mapa. Verifique a conexão e atualize a página.'); return false; }
      map = L.map('map', {preferCanvas:true, zoomControl:true}).setView([-18.5,-44.5],6);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);
      L.control.scale({metric:true, imperial:false, position:'topleft', maxWidth:180}).addTo(map);
      L_access = L.featureGroup().addTo(map); L_alerts = L.featureGroup().addTo(map);
      L_clusters = L.featureGroup().addTo(map); L_route = L.featureGroup().addTo(map); L_gps = L.featureGroup().addTo(map);
      const legend = L.control({position:'bottomleft'});
      legend.onAdd = () => { const d=L.DomUtil.create('div','legend'); d.innerHTML='<b>Escore de risco</b><br><i style="background:#7f1d1d"></i>Crítico (top 10%)<br><i style="background:#dc2626"></i>Alto<br><i style="background:#f97316"></i>Médio<br><i style="background:#facc15"></i>Baixo<br><span style="color:#1d4ed8">▬</span> Rota preventiva'; return d; };
      legend.addTo(map);
      return true;
    }

    /* ---------- filtros em cascata ---------- */
    function tupleValue(t, lvl) {
      switch (lvl) {
        case 'rpm': return t[0]; case 'cia': return t[1];
        case 'pelotao': return t[2] ? [t[1],t[2]].filter(Boolean).join(JOIN) : '';
        case 'grupamento': return t[3] ? [t[1],t[2],t[3]].filter(Boolean).join(JOIN) : '';
        default: return t[4];
      }
    }
    function tupleLabel(t, lvl, sel) {
      if (lvl === 'pelotao') return sel.cia || !t[1] ? t[2] : t[2]+' — '+t[1];
      if (lvl === 'grupamento') { if (sel.pelotao) return t[3]; const up = sel.cia ? t[2] : [t[2],t[1]].filter(Boolean).join(' / '); return up ? t[3]+' — '+up : t[3]; }
      return tupleValue(t, lvl);
    }
    function selection() { const s={}; LEVELS.forEach(l => { const v=$(SEL[l]).value; s[l] = !v || v==='TODOS' ? '' : v; }); return s; }
    function matchesUpper(t, sel, idx) { for (let i=0;i<idx;i++) { const l=LEVELS[i]; if (sel[l] && norm(tupleValue(t,l)) !== norm(sel[l])) return false; } return true; }
    function refreshOptions(fromIdx) {
      const sel = selection();
      for (let i=fromIdx; i<LEVELS.length; i++) {
        const lvl = LEVELS[i], found = new Map();
        TUPLAS.forEach(t => { if (!matchesUpper(t, sel, i)) return; const v=tupleValue(t,lvl); if (v && !found.has(norm(v))) found.set(norm(v), {v, label:tupleLabel(t,lvl,sel)}); });
        const items = [...found.values()].sort((a,b) => a.v.localeCompare(b.v,'pt-BR',{numeric:true,sensitivity:'base'}));
        const el = $(SEL[lvl]), keep = sel[lvl];
        el.replaceChildren(new Option(ALL[lvl]+(items.length?' ('+items.length+')':''), 'TODOS'));
        items.forEach(it => el.add(new Option(it.label, it.v)));
        el.value = keep && found.has(norm(keep)) ? found.get(norm(keep)).v : 'TODOS';
        sel[lvl] = el.value === 'TODOS' ? '' : el.value;
        el.disabled = !items.length;
        el.classList.toggle('active-filter', el.value !== 'TODOS');
      }
    }
    function loadFilters() {
      loading(true,'Carregando RPMs, Cias, Pelotões e Grupamentos...');
      run('getDadosCompletosFiltros').then(res => {
        res = res || {};
        TUPLAS = Array.isArray(res.tuplas) ? res.tuplas : [];
        if (res.pesos) { PESOS = res.pesos; $('lblPeso').textContent = fmt(PESOS.recente,1); }
        refreshOptions(0);
        const av = Array.isArray(res.avisos) ? res.avisos : [], lt = Array.isArray(res.leitura) ? res.leitura : [];
        if (av.length) notice('<button class="x" type="button" onclick="notice(\'\')" aria-label="Fechar">✕</button><strong>Atenção:</strong>' + av.map(a => '<div>• '+esc(a)+'</div>').join('') +
          (lt.length ? '<details><summary>Ver como cada aba foi lida</summary>' + lt.map(x => '<div>• '+esc(x)+'</div>').join('') + '</details>' : ''));
        if (!TUPLAS.some(t => t[0])) $('selectRpm').title = 'A planilha ainda não informa a RPM dos municípios';
        loading(false);
      }).catch(err => { loading(false); notice('<strong>Falha ao carregar filtros:</strong> '+esc(err && err.message || err)); });
    }

    /* ---------- horário ---------- */
    function fillHours() { ['horaIni','horaFim'].forEach((id,k) => { const s=$(id); for (let h=0;h<24;h++) s.add(new Option(String(h).padStart(2,'0')+'h', h)); s.value = k ? 20 : 17; }); }
    function timeWindow() {
      const v = $('selectTurno').value;
      if (v === 'TODOS') return {start:null,end:null,label:'24 horas'};
      if (v === 'CUSTOM') { const a=Number($('horaIni').value), b=Number($('horaFim').value); return {start:a,end:b,label:String(a).padStart(2,'0')+'h–'+String(b).padStart(2,'0')+'h'}; }
      let t;
      if (v === 'AUTO') { const h=new Date().getHours(); t = TURNOS.find(x => x[2] < x[3] ? h>=x[2] && h<x[3] : h>=x[2] || h<x[3]); }
      else t = TURNOS.find(x => x[0] === v);
      return {start:t[2], end:t[3], label:t[1]+' ('+String(t[2]).padStart(2,'0')+'h–'+String(t[3]).padStart(2,'0')+'h)'};
    }
    function updateAutoLabel() { const o=$('selectTurno').querySelector('option[value="AUTO"]'); const h=new Date().getHours(); const t=TURNOS.find(x => x[2] < x[3] ? h>=x[2] && h<x[3] : h>=x[2] || h<x[3]); o.textContent='Automático — agora: '+t[1]; }

    /* ---------- consulta ---------- */
    function processRoute() {
      const tw = timeWindow(), sel = selection();
      const params = Object.assign({}, sel, {horaInicio:tw.start, horaFim:tw.end});
      loading(true,'Buscando registros STV da área e calculando hotspots...'); $('btnGerar').disabled = true;
      run('calcularRotaAvancada', params).then(res => {
        $('btnGerar').disabled = false; loading(false);
        if (window.matchMedia('(max-width:820px)').matches) $('controls').classList.add('collapsed');
        RESULT = res; RESULT.janela = tw.label; ROUTE = null; CURRENT = null; L_access.clearLayers();
        if (!res || !res.cells || !res.cells.length) { clearMap(); $('summary').style.display='none'; alert('Nenhum registro encontrado para os filtros selecionados.'); return; }
        const b = res.bounds ? L.latLngBounds(res.bounds) : null;
        if (b && b.isValid()) map.fitBounds(b.pad(0.05), {padding:[30,30], maxZoom:14});
        recluster(true);
        loadAlerts();
      }).catch(err => { $('btnGerar').disabled=false; loading(false); alert('Falha ao calcular: '+(err&&err.message||err)); });
    }
    function clearMap() { [L_clusters,L_route,L_access,L_alerts].forEach(l => l.clearLayers()); }

    /* ---------- agrupamento por densidade (no navegador) ---------- */
    function clusterCells(cells, R) {
      const lat0 = cells[0].la * Math.PI/180, dLat = R/111320, dLng = R/(111320*Math.cos(lat0));
      const grid = new Map(), gk = (a,b) => a+':'+b;
      cells.forEach((c,i) => { const k=gk(Math.floor(c.la/dLat),Math.floor(c.lo/dLng)); if(!grid.has(k)) grid.set(k,[]); grid.get(k).push(i); });
      const order = cells.map((_,i)=>i).sort((a,b)=>cells[b].n-cells[a].n), used = new Uint8Array(cells.length), out = [];
      order.forEach(i => {
        if (used[i]) return; used[i]=1; const s=cells[i], members=[s];
        const gy=Math.floor(s.la/dLat), gx=Math.floor(s.lo/dLng);
        for (let y=-1;y<=1;y++) for (let x=-1;x<=1;x++) (grid.get(gk(gy+y,gx+x))||[]).forEach(j => { if (!used[j] && hav([s.la,s.lo],[cells[j].la,cells[j].lo]) <= R) { used[j]=1; members.push(cells[j]); } });
        out.push(aggregate(members));
      });
      return out;
    }
    function inc(o,k,n) { if (k) o[k]=(o[k]||0)+n; }
    function topKeys(o) { return Object.keys(o).sort((a,b)=>o[b]-o[a]); }
    function aggregate(ms) {
      const a={lat:0,lng:0,n:0,s:0,sn:0,r:[0,0,0],h:null,rd:{},ci:{},fr:{},sd:{},km:null,ul:'',cells:ms.length};
      ms.forEach(m => {
        a.lat+=m.la*m.n; a.lng+=m.lo*m.n; a.n+=m.n; a.s+=m.s; a.sn+=m.sn; for (let k=0;k<3;k++) a.r[k]+=m.r[k];
        if (m.h) { a.h=a.h||new Array(24).fill(0); m.h.forEach((v,k)=>a.h[k]+=v); }
        inc(a.rd,m.rd,m.n); inc(a.ci,m.ci,m.n); inc(a.fr,m.fr,m.n); inc(a.sd,m.sd,m.n);
        if (m.km) a.km = a.km ? [Math.min(a.km[0],m.km[0]),Math.max(a.km[1],m.km[1])] : m.km.slice();
        if (m.ul && (!a.ul || toTime(m.ul) > toTime(a.ul))) a.ul=m.ul;
      });
      a.lat/=a.n; a.lng/=a.n; a.rodovias=topKeys(a.rd); a.cidades=topKeys(a.ci); a.fracoes=topKeys(a.fr); a.sede=topKeys(a.sd)[0]||'';
      return a;
    }
    function toTime(s) { const m=String(s).match(/(\d{2})\/(\d{2})\/(\d{4})/); return m ? new Date(+m[3],m[2]-1,+m[1]).getTime() : 0; }
    function score(c) {
      const w = Number($('selJanela').value), rec = c.r[w];
      const base = $('chkRecente').checked && RESULT.temData ? PESOS.recente*rec + PESOS.historico*(c.n-rec) : c.n;
      if (!$('chkGravidade').checked) return base;
      const avg = c.sn ? c.s/c.sn : 1;
      return avg * Math.log(1+base) * 10;
    }
    function recluster(withRoute) {
      if (!RESULT || !RESULT.cells.length) return;
      const R = radius();
      CLUSTERS = clusterCells(RESULT.cells, R);
      CLUSTERS.forEach(c => c.escore = score(c));
      CLUSTERS.sort((a,b) => b.escore-a.escore || b.n-a.n);
      CLUSTERS.forEach((c,i) => { c.rank=i+1; c.id='c'+i; });
      drawClusters(R);
      if (withRoute) buildRoute(); else if (ROUTE) redrawRouteMarkers();
      updateSummary();
    }
    function colorFor(i, n) { const q=i/Math.max(1,n); return q<.1?'#7f1d1d':q<.3?'#dc2626':q<.6?'#f97316':'#facc15'; }
    function popupHtml(c) {
      const stop = ROUTE ? ROUTE.stops.findIndex(s => s.id===c.id) : -1;
      return '<div class="popup-card"><h4>Ponto Preditivo #'+c.rank+'</h4>'+
        '<strong>Rodovia:</strong> '+esc(c.rodovias.slice(0,2).join(', ')||'N/D')+'<br>'+
        '<strong>Cidade:</strong> '+esc(c.cidades.slice(0,2).join(', ')||'N/D')+'<br>'+
        '<strong>Fração responsável:</strong> '+esc(c.fracoes[0]||'PMRv')+'<br>'+
        '<strong>Escore de Risco:</strong> '+fmt(c.escore,1)+'<br>'+
        '<strong>Volume STV:</strong> '+fmt(c.n)+
        (stop >= 0 ? '<br><strong>Parada da rota:</strong> nº '+(stop+1) : '')+
        '<div class="popup-note">Patrulhamento preventivo orientado</div></div>';
    }
    function drawClusters(R) {
      L_clusters.clearLayers();
      const n = CLUSTERS.length, show = CLUSTERS.slice(0, 1500);
      show.forEach((c,i) => {
        const col = colorFor(i, n);
        L.circle([c.lat,c.lng], {radius:R, color:col, weight:i<10?2:1, fillColor:col, fillOpacity:i<10?.42:.25})
          .bindPopup(() => popupHtml(c)).on('click', () => openCard(c)).addTo(L_clusters);
        if (i < 10) L.marker([c.lat,c.lng], {icon:L.divIcon({className:'rank-icon',html:String(c.rank),iconSize:[24,24]}), zIndexOffset:500})
          .bindPopup(() => popupHtml(c)).on('click', () => openCard(c)).addTo(L_clusters);
      });
    }
    function updateSummary() {
      const sel = selection(), area = LEVELS.map(l => sel[l] && $(SEL[l]).selectedOptions[0].textContent).filter(Boolean).join(' · ') || 'Todo o CPE';
      const s = $('summary');
      s.innerHTML = '<span>Área: <b>'+esc(area)+'</b></span><span>Horário: <b>'+esc(RESULT.janela)+'</b></span>'+
        '<span>Registros STV: <b>'+fmt(RESULT.totalRegistros)+'</b></span><span>Hotspots (raio '+km(radius())+'): <b>'+fmt(CLUSTERS.length)+'</b></span>'+
        (ROUTE ? '<span>Rota: <b>'+ROUTE.stops.length+' pontos'+(ROUTE.km?' · '+fmt(ROUTE.km,1)+' km · '+minTxt(ROUTE.min):'')+'</b></span>' : '')+
        (RESULT.temData && $('chkRecente').checked ? '<span>Referência recente: <b>'+esc(RESULT.referencia)+'</b>'+(RESULT.referenciaAjustada?' (último registro)':'')+'</span>' : '');
      s.style.display='flex';
    }

    /* ---------- rota preventiva ---------- */
    function routeOrigin() {
      const mode = $('selectOrigem').value;
      if (mode === 'GPS' && GPS.pos) return {lat:GPS.pos[0], lng:GPS.pos[1], nome:'Minha localização'};
      if (mode === 'SEDE' && RESULT.origemSede && isFinite(RESULT.origemSede.lat)) return RESULT.origemSede;
      return null;
    }
    function nnOrder(origin, pts) {
      const rest = pts.slice(), out = []; let cur = origin ? [origin.lat,origin.lng] : null;
      if (!cur && rest.length) { const f=rest.shift(); out.push(f); cur=[f.lat,f.lng]; }
      while (rest.length) { let bi=0, bd=Infinity; rest.forEach((p,i) => { const d=hav(cur,[p.lat,p.lng]); if (d<bd) { bd=d; bi=i; } }); const p=rest.splice(bi,1)[0]; out.push(p); cur=[p.lat,p.lng]; }
      return out;
    }
    function tourMeters(origin, pts, back) {
      const o = nnOrder(origin, pts); let d=0, prev = origin ? [origin.lat,origin.lng] : null;
      o.forEach(p => { if (prev) d += hav(prev,[p.lat,p.lng]); prev=[p.lat,p.lng]; });
      if (back && origin && prev) d += hav(prev,[origin.lat,origin.lng]);
      return d;
    }
    function buildRoute() {
      if (!CLUSTERS.length) return;
      const N = Number($('selectPontos').value), maxKm = Number($('selectKm').value), origin = routeOrigin(), back = !!origin;
      const chosen = [], skipped = [];
      for (const c of CLUSTERS.slice(0, Math.max(N*5, 40))) {
        if (chosen.length >= N) break;
        const est = tourMeters(origin, chosen.concat([c]), back) * 1.3 / 1000; // fator de sinuosidade da via
        if (maxKm && est > maxKm) { skipped.push(c); continue; }
        chosen.push(c);
      }
      if (!chosen.length) { ROUTE=null; L_route.clearLayers(); notice('<strong>Rota:</strong> nenhum ponto cabe na extensão máxima escolhida a partir da origem. Aumente a extensão ou mude o início da rota.'); return; }
      ROUTE = {origin, back, stops:nnOrder(origin, chosen), skipped:skipped.length, km:0, min:0, legs:[], path:null, viario:false};
      drawRoute();
      if (tab === 'rota') renderPanel();
      loading(true,'Traçando a rota pelas rodovias...');
      run('calcularTrajeto', {origem:origin, retornar:back, pontos:ROUTE.stops.map(s => ({id:s.id, lat:+s.lat.toFixed(6), lng:+s.lng.toFixed(6)}))}).then(res => {
        loading(false);
        if (!res || !res.ok) { notice('<strong>Rota:</strong> traçado viário indisponível agora ('+esc(res && res.motivo || 'sem resposta')+'). Exibindo ligação direta; os links do Google Maps/Waze continuam válidos.'); return; }
        const byId = new Map(ROUTE.stops.map(s => [s.id,s]));
        ROUTE.stops = res.sequencia.map(id => byId.get(id)).filter(Boolean);
        Object.assign(ROUTE, {path:res.path, legs:res.legs, km:res.km, min:res.min, resumo:res.resumo, avisos:res.avisos, viario:true});
        drawRoute(); updateSummary(); if (tab === 'rota') renderPanel();
      }).catch(err => { loading(false); notice('<strong>Rota:</strong> '+esc(err && err.message || err)); });
      updateSummary(); openPanel('rota');
    }
    function drawRoute() {
      L_route.clearLayers(); if (!ROUTE) return;
      const pts = ROUTE.path || [].concat(ROUTE.origin?[[ROUTE.origin.lat,ROUTE.origin.lng]]:[], ROUTE.stops.map(s=>[s.lat,s.lng]), ROUTE.back&&ROUTE.origin?[[ROUTE.origin.lat,ROUTE.origin.lng]]:[]);
      L.polyline(pts, {color:'#1d4ed8', weight:ROUTE.viario?5:3, opacity:.8, dashArray:ROUTE.viario?null:'8 6'}).addTo(L_route);
      if (ROUTE.origin) L.marker([ROUTE.origin.lat,ROUTE.origin.lng], {icon:L.divIcon({className:'stop-icon',html:'⌂',iconSize:[24,24]})}).bindTooltip('Início: '+esc(ROUTE.origin.nome||'')).addTo(L_route);
      redrawRouteMarkers();
    }
    function redrawRouteMarkers() {
      L_route.eachLayer(l => { if (l.options && l.options.stopMarker) L_route.removeLayer(l); });
      ROUTE.stops.forEach((s,i) => L.marker([s.lat,s.lng], {stopMarker:true, zIndexOffset:800, icon:L.divIcon({className:'stop-icon',html:String(i+1),iconSize:[24,24]})})
        .bindPopup(() => popupHtml(s)).on('click', () => openCard(s)).addTo(L_route));
    }
    function place(p) { return p.nome && !isFinite(p.lat) ? p.nome+', MG' : (+p.lat).toFixed(6)+','+(+p.lng).toFixed(6); }
    function mapsLinks() {
      if (!ROUTE) return [];
      const seq = [].concat(ROUTE.origin?[ROUTE.origin]:[], ROUTE.stops, ROUTE.back&&ROUTE.origin?[ROUTE.origin]:[]);
      const W = IS_MOBILE ? 3 : 9, links = [];
      // Limite do Google Maps por link: até 9 paradas intermediárias (3 no celular). A rota é dividida em trechos encadeados.
      for (let i=0; i<seq.length-1;) {
        const end = Math.min(i+W+1, seq.length-1), wps = seq.slice(i+1,end).map(place);
        links.push({de:i, ate:end, url:'https://www.google.com/maps/dir/?api=1&travelmode=driving&origin='+encodeURIComponent(place(seq[i]))+'&destination='+encodeURIComponent(place(seq[end]))+(wps.length?'&waypoints='+encodeURIComponent(wps.join('|')):'')});
        i = end;
      }
      return links;
    }
    function wazeUrl(p) { return 'https://waze.com/ul?ll='+(+p.lat).toFixed(6)+','+(+p.lng).toFixed(6)+'&navigate=yes'; }
    function gmapsUrl(p, from) { return 'https://www.google.com/maps/dir/?api=1&travelmode=driving'+(from?'&origin='+encodeURIComponent(place(from)):'')+'&destination='+(+p.lat).toFixed(6)+','+(+p.lng).toFixed(6); }

    /* ---------- alertas (bloqueios, acidentes, congestionamentos) ---------- */
    function loadAlerts() {
      if (!RESULT || !RESULT.bounds) return;
      run('getAlertasVia', RESULT.bounds).then(res => { ALERTS = res || ALERTS; drawAlerts(); if (tab==='alertas' || tab==='trecho') renderPanel(); }).catch(() => {});
    }
    function alertIcon(t) { t=norm(t); return t.includes('interd')||t.includes('bloque')||t.includes('closed')?'⛔':t.includes('acident')?'💥':t.includes('obra')?'🚧':t.includes('congest')||t.includes('estrang')?'🐢':'⚠️'; }
    function drawAlerts() {
      L_alerts.clearLayers();
      ALERTS.alertas.forEach(a => L.marker([a.lat,a.lng], {icon:L.divIcon({className:'alert-icon',html:alertIcon(a.tipo),iconSize:[22,22]})})
        .bindPopup('<b>'+esc(a.tipo)+'</b>'+(a.via?'<br>'+esc(a.via):'')+(a.desc?'<br>'+esc(a.desc):'')+'<br><small>Fonte: '+esc(a.fonte)+'</small>').addTo(L_alerts));
      ALERTS.congestionamentos.forEach(j => L.polyline(j.path, {color:j.nivel>=4?'#991b1b':'#ea580c', weight:6, opacity:.7})
        .bindPopup('<b>Congestionamento / estrangulamento</b><br>'+esc(j.via)+'<br>Atraso: '+j.atrasoMin+' min · '+fmt(j.km,1)+' km').addTo(L_alerts));
    }
    function alertsNear(lat, lng, meters) { return ALERTS.alertas.map(a => Object.assign({d:hav([lat,lng],[a.lat,a.lng])}, a)).filter(a => a.d <= meters).sort((a,b)=>a.d-b.d); }

    /* ---------- painel: cartão do trecho / rota / alertas ---------- */
    function openPanel(t) { tab = t || tab; $('panel').classList.add('open'); document.querySelectorAll('.panel-tabs button[data-tab]').forEach(b => b.classList.toggle('active', b.dataset.tab===tab)); document.querySelectorAll('.menu-btn').forEach(b => b.classList.toggle('active', b.dataset.tab===tab)); renderPanel(); }
    function openCard(c) { CURRENT = c; openPanel('trecho'); }
    function renderPanel() {
      const b = $('panelBody');
      if (tab === 'rota') b.innerHTML = routeHtml();
      else if (tab === 'alertas') b.innerHTML = alertsHtml();
      else b.innerHTML = cardHtml(CURRENT || CLUSTERS[0]);
    }
    function hoursHtml(h) {
      if (!h) return '<p class="muted">A base não informa horário.</p>';
      const mx = Math.max(...h, 1), peaks = h.map((v,i)=>[v,i]).sort((a,b)=>b[0]-a[0]).filter(x=>x[0]).slice(0,3).map(x=>x[1]);
      return '<div class="hours">'+h.map((v,i)=>'<div class="'+(peaks.includes(i)?'peak':'')+'" style="height:'+Math.round(v/mx*100)+'%" title="'+String(i).padStart(2,'0')+'h: '+v+'"></div>').join('')+'</div>'+
        '<div class="hours-axis"><span>00h</span><span>06h</span><span>12h</span><span>18h</span><span>23h</span></div>'+
        '<p>Pico: <b>'+peaks.sort((a,b)=>a-b).map(i=>String(i).padStart(2,'0')+'h').join(', ')+'</b></p>';
    }
    function cardHtml(c) {
      if (!c) return '<p class="muted">Gere a rota e clique em um hotspot para ver o cartão do trecho.</p>';
      const stopIdx = ROUTE ? ROUTE.stops.findIndex(s => s.id===c.id) : -1;
      const near = alertsNear(c.lat, c.lng, 5000);
      const kmTxt = c.km ? (c.km[0]===c.km[1] ? 'km '+fmt(c.km[0],1) : 'km '+fmt(c.km[0],1)+' a '+fmt(c.km[1],1)) : '';
      const w = Number($('selJanela').value), jan = [30,60,90][w];
      const sede = c.sede || (RESULT.origemSede && RESULT.origemSede.nome) || '';
      return '<h3>Ponto Preditivo #'+c.rank+'</h3><div class="muted">'+(stopIdx>=0?'Parada nº '+(stopIdx+1)+' da rota · ':'')+esc(fmt(c.lat,5)+', '+fmt(c.lng,5))+'</div>'+
        '<h4>Trecho</h4><dl class="kv">'+
        '<dt>Rodovia</dt><dd>'+esc(c.rodovias.slice(0,3).join(', ')||'N/D')+(kmTxt?' · '+kmTxt:'')+'</dd>'+
        '<dt>Município</dt><dd>'+esc(c.cidades.slice(0,3).join(', ')||'N/D')+'</dd>'+
        '<dt>Fração</dt><dd>'+esc(c.fracoes[0]||'PMRv')+'</dd>'+
        (sede?'<dt>Sede</dt><dd>'+esc(sede)+'</dd>':'')+
        '<dt>Escore de risco</dt><dd>'+fmt(c.escore,1)+'</dd>'+
        '<dt>Volume STV</dt><dd>'+fmt(c.n)+' registros'+(RESULT.temData?' · '+fmt(c.r[w])+' nos últimos '+jan+' dias':'')+'</dd>'+
        (c.ul?'<dt>Último registro</dt><dd>'+esc(c.ul)+'</dd>':'')+
        (c.sn?'<dt>Gravidade média</dt><dd>'+fmt(c.s/c.sn,1)+'</dd>':'')+
        '<dt>Abrangência</dt><dd>raio de '+km(radius())+' ('+c.cells+' células)</dd></dl>'+
        '<h4>Plano rodoviário — trechos da área</h4>'+planoHtml(c)+
        '<h4>Horário dos registros</h4>'+hoursHtml(c.h)+
        '<h4>Alertas na via (até 5 km)</h4>'+(near.length ? near.slice(0,6).map(a=>'<div class="alert-item'+(alertIcon(a.tipo)==='⛔'?' closed':'')+'">'+alertIcon(a.tipo)+' <b>'+esc(a.tipo)+'</b> a '+km(a.d)+(a.via?' · '+esc(a.via):'')+(a.desc?'<br><small>'+esc(a.desc)+'</small>':'')+'</div>').join('') : '<p class="muted">Nenhum alerta cadastrado'+(ALERTS.fontes.length?' ('+esc(ALERTS.fontes.join(', '))+')':'')+'.</p>')+
        '<h4>Deslocamento para atendimento</h4>'+
        '<div class="btn-row"><button class="btn-sm alt" type="button" onclick="accessRoutes(\''+c.id+'\')">Rotas de acesso + alternativas</button>'+
        '<a class="btn-sm wz" target="_blank" rel="noopener" href="'+wazeUrl(c)+'">Waze</a>'+
        '<a class="btn-sm gm" target="_blank" rel="noopener" href="'+gmapsUrl(c)+'">Google Maps</a>'+
        '<button class="btn-sm ghost" type="button" onclick="map.setView(['+c.lat+','+c.lng+'],14)">Centralizar</button></div>'+
        '<div id="accessBox"></div>';
    }
    function roadNum(s) { const m=String(s||'').match(/(\d{2,3})/); return m ? String(Number(m[1])) : ''; }
    function segKm(s) { return s.ini!=null && s.fim!=null ? 'km '+fmt(s.ini,1)+' a '+fmt(s.fim,1) : ''; }
    function segHtml(s) {
      return '<div class="seg"><b>'+esc(s.rod)+'</b>'+(segKm(s)?' · '+segKm(s):'')+(s.ext!=null?' · '+fmt(s.ext,1)+' km':'')+
        ((s.di||s.df)?'<br><small>'+esc(s.di||'?')+' → '+esc(s.df||'?')+'</small>':'')+
        '<br><small>'+esc([s.mun, s.fr, s.sit].filter(Boolean).join(' · '))+'</small></div>';
    }
    function planoHtml(c) {
      const malha = (RESULT && RESULT.malha) || [];
      if (!malha.length) return '<p class="muted">Sem trechos do PLANO_RODOVIARIO para a área filtrada.</p>';
      const roads = c.rodovias.map(roadNum).filter(Boolean), cities = c.cidades.map(norm);
      let segs = malha.filter(s => roads.length && roads.includes(roadNum(s.rod)) &&
        (!c.km || s.ini==null || (c.km[1] >= Math.min(s.ini,s.fim)-1 && c.km[0] <= Math.max(s.ini,s.fim)+1)));
      if (!segs.length) segs = malha.filter(s => cities.includes(norm(s.mun)));
      if (!segs.length) return '<p class="muted">Nenhum trecho do plano rodoviário cadastrado para '+esc(c.cidades[0]||'este ponto')+'.</p>';
      return segs.slice(0,6).map(segHtml).join('') + (segs.length>6?'<p class="muted">+ '+(segs.length-6)+' trecho(s)</p>':'');
    }
    function malhaHtml() {
      const malha = (RESULT && RESULT.malha) || [];
      if (!malha.length) return '';
      const by = {}; malha.forEach(s => { const k=s.rod; by[k]=by[k]||{rod:k,ext:0,n:0}; by[k].ext+=Number(s.ext)||0; by[k].n++; });
      const list = Object.values(by).sort((a,b)=>b.ext-a.ext), total = list.reduce((a,x)=>a+x.ext,0);
      return '<h4>Malha sob responsabilidade (plano rodoviário)</h4><p>'+malha.length+' trechos · <b>'+fmt(total,1)+' km</b></p>'+
        list.slice(0,12).map(x => '<div class="seg"><b>'+esc(x.rod)+'</b> · '+fmt(x.ext,1)+' km em '+x.n+' trecho(s)</div>').join('')+
        (list.length>12?'<p class="muted">+ '+(list.length-12)+' rodovia(s)</p>':'');
    }
    function accessRoutes(id) {
      const c = CLUSTERS.find(x => x.id===id) || (ROUTE && ROUTE.stops.find(x => x.id===id)); if (!c) return;
      const origem = GPS.pos ? {lat:GPS.pos[0], lng:GPS.pos[1], nome:'Minha localização'} :
        (RESULT.origemSede && isFinite(RESULT.origemSede.lat) ? RESULT.origemSede : (c.sede ? {nome:c.sede} : null));
      if (!origem) { $('accessBox').innerHTML='<p class="muted">Sem origem: ative o GPS ou filtre uma fração com sede cadastrada na ARTICULACAO.</p>'; return; }
      loading(true,'Calculando rotas de acesso e alternativas...');
      run('rotasAcesso', {origem, destino:{lat:+c.lat.toFixed(6), lng:+c.lng.toFixed(6)}}).then(res => {
        loading(false); L_access.clearLayers();
        if (!res || !res.ok) { $('accessBox').innerHTML='<p class="muted">Rotas indisponíveis ('+esc(res&&res.motivo)+').</p>'; return; }
        const colors = ['#1d4ed8','#7c3aed','#0891b2'];
        res.rotas.forEach((r,i) => L.polyline(r.path, {color:colors[i], weight:i?4:6, opacity:i?.65:.9, dashArray:i?'10 6':null}).addTo(L_access));
        const blocked = r => r.path.some((p,k) => k%5===0 && ALERTS.alertas.some(a => alertIcon(a.tipo)==='⛔' && hav(p,[a.lat,a.lng])<300));
        $('accessBox').innerHTML = '<p class="muted">Origem: '+esc(origem.nome||'')+'</p>'+res.rotas.map((r,i) =>
          '<div class="alt-route" style="border-color:'+colors[i]+'"><b>'+(i?'Alternativa '+i:'Rota principal')+'</b> — via '+esc(r.via||'N/D')+'<br>'+fmt(r.km,1)+' km · '+minTxt(r.min)+
          (blocked(r)?'<br><b style="color:#dc2626">⛔ Passa por interdição cadastrada — prefira outra rota.</b>':'')+
          (r.avisos&&r.avisos.length?'<br><small>'+esc(r.avisos.join(' '))+'</small>':'')+'</div>').join('')+
          '<div class="btn-row"><a class="btn-sm gm" target="_blank" rel="noopener" href="'+gmapsUrl(c, origem)+'">Navegar no Google Maps</a><a class="btn-sm wz" target="_blank" rel="noopener" href="'+wazeUrl(c)+'">Navegar no Waze</a></div>';
        map.fitBounds(L_access.getBounds().pad(0.1));
      }).catch(err => { loading(false); $('accessBox').innerHTML='<p class="muted">'+esc(err&&err.message||err)+'</p>'; });
    }
    function routeHtml() {
      if (!ROUTE) return '<p class="muted">Gere a rota preventiva para ver as paradas.</p>';
      const next = nextStop();
      const links = mapsLinks();
      const nearRoute = ROUTE.path ? ALERTS.alertas.filter(a => ROUTE.path.some((p,k) => k%4===0 && hav(p,[a.lat,a.lng]) < 2000)) : [];
      return '<h3>Rota preventiva</h3><div class="muted">'+ROUTE.stops.length+' paradas'+(ROUTE.km?' · '+fmt(ROUTE.km,1)+' km · '+minTxt(ROUTE.min):' · estimativa em linha reta')+(ROUTE.resumo?' · via '+esc(ROUTE.resumo):'')+'</div>'+
        (ROUTE.skipped?'<p class="muted">'+ROUTE.skipped+' hotspot(s) de maior escore ficaram fora por excederem a extensão máxima.</p>':'')+
        (next?'<div class="alert-item"><b>Próxima parada: nº '+(next.i+1)+'</b> — '+km(next.d)+' · <a target="_blank" rel="noopener" href="'+wazeUrl(next.s)+'">Waze</a></div>':'')+
        (nearRoute.length?'<div class="alert-item closed">⚠ '+nearRoute.length+' alerta(s) a menos de 2 km da rota — veja a aba Alertas.</div>':'')+
        '<h4>Navegação GPS (Google Maps em '+links.length+' trecho'+(links.length>1?'s':'')+')</h4><div class="btn-row">'+
        links.map((l,i) => '<a class="btn-sm gm" target="_blank" rel="noopener" href="'+l.url+'">Trecho '+(i+1)+'</a>').join('')+'</div>'+
        '<p class="muted" style="font-size:.68rem">O Google Maps aceita até '+(IS_MOBILE?'3':'9')+' paradas intermediárias por link'+(IS_MOBILE?' no celular':'')+'; a rota foi dividida em trechos encadeados. O Waze navega um destino por vez (botão em cada parada).</p>'+
        '<h4>Paradas</h4>'+
        (ROUTE.origin?'<div class="stop"><div class="num">⌂</div><div><b>Início:</b> '+esc(ROUTE.origin.nome||'')+'</div><div></div></div>':'')+
        ROUTE.stops.map((s,i) => { const leg = ROUTE.legs[ROUTE.origin?i:i-1];
          return '<div class="stop'+(GPS.visited.has(s.id)?' done':'')+(next&&next.i===i?' next':'')+'"><div class="num">'+(i+1)+'</div><div><b>#'+s.rank+' · '+esc(s.rodovias[0]||'Rodovia N/D')+'</b><br><small>'+esc(s.cidades[0]||'')+' · escore '+fmt(s.escore,1)+' · '+fmt(s.n)+' reg.'+(leg?' · trecho '+fmt(leg.km,1)+' km / '+minTxt(leg.min):'')+'</small></div>'+
            '<div style="display:flex;flex-direction:column;gap:3px"><a class="btn-sm wz" target="_blank" rel="noopener" href="'+wazeUrl(s)+'">Waze</a><button class="btn-sm ghost" type="button" onclick="openCard(ROUTE.stops['+i+'])">Cartão</button></div></div>'; }).join('')+
        (ROUTE.back&&ROUTE.origin?'<div class="stop"><div class="num">⌂</div><div><b>Retorno:</b> '+esc(ROUTE.origin.nome||'')+'</div><div></div></div>':'')+
        (ROUTE.avisos&&ROUTE.avisos.length?'<p class="muted"><small>'+esc(ROUTE.avisos.join(' '))+'</small></p>':'')+malhaHtml();
    }
    function alertsHtml() {
      const a = ALERTS.alertas, j = ALERTS.congestionamentos;
      const src = ALERTS.fontes.length ? ALERTS.fontes.join(', ') : 'nenhuma fonte configurada';
      return '<h3>Alertas na via</h3><div class="muted">Fontes: '+esc(src)+'</div>'+
        (a.length||j.length ? a.map(x=>'<div class="alert-item'+(alertIcon(x.tipo)==='⛔'?' closed':'')+'">'+alertIcon(x.tipo)+' <b>'+esc(x.tipo)+'</b>'+(x.via?' · '+esc(x.via):'')+(x.desc?'<br><small>'+esc(x.desc)+'</small>':'')+'<br><small>'+esc(x.fonte)+'</small></div>').join('')+
          j.map(x=>'<div class="alert-item">🐢 <b>Congestionamento</b> · '+esc(x.via)+' · atraso '+x.atrasoMin+' min</div>').join('')

        '<h4>Como alimentar</h4><p class="muted" style="font-size:.7rem">1) Aba <b>BLOQUEIOS</b> na planilha: Latitude | Longitude | Tipo (Interdição, Acidente, Obra, Estrangulamento) | Rodovia | Descrição.<br>'+
        '2) Waze for Cities (parceria gratuita do Waze com órgãos públicos): cadastre a URL do feed em Propriedades do script ▸ <b>WAZE_FEED_URL</b>.</p>';

    /* ---------- GPS ---------- */
    function nextStop() {
      if (!ROUTE || !GPS.pos) return null;
      const i = ROUTE.stops.findIndex(s => !GPS.visited.has(s.id)); if (i < 0) return null;
      return {i, s:ROUTE.stops[i], d:hav(GPS.pos,[ROUTE.stops[i].lat,ROUTE.stops[i].lng])};
    }
    function toggleGps() {
      if (GPS.watch !== null) { navigator.geolocation.clearWatch(GPS.watch); GPS.watch=null; $('btnGps').classList.remove('on'); return; }
      if (!navigator.geolocation) { alert('GPS indisponível neste navegador. Use os botões do Google Maps/Waze.'); return; }
      GPS.watch = navigator.geolocation.watchPosition(p => {
        GPS.pos = [p.coords.latitude, p.coords.longitude]; $('btnGps').classList.add('on');
        if (!GPS.marker) GPS.marker = L.marker(GPS.pos, {icon:L.divIcon({className:'gps-icon',iconSize:[16,16]}), zIndexOffset:1000}).bindTooltip('Minha posição').addTo(L_gps);
        else GPS.marker.setLatLng(GPS.pos);
        if (ROUTE) ROUTE.stops.forEach(s => { if (hav(GPS.pos,[s.lat,s.lng]) <= Math.max(radius(), 300)) GPS.visited.add(s.id); });
        if (tab === 'rota') renderPanel();
      }, err => {
        navigator.geolocation.clearWatch(GPS.watch); GPS.watch=null; $('btnGps').classList.remove('on');
        alert('Não foi possível obter a localização ('+err.message+'). Em alguns navegadores o GPS é bloqueado dentro do Apps Script; use os botões do Google Maps/Waze, que abrem a navegação no aparelho.');
      }, {enableHighAccuracy:true, maximumAge:10000, timeout:20000});
    }

    /* ---------- eventos ---------- */
    function clearFilters() { LEVELS.forEach(l => $(SEL[l]).value='TODOS'); refreshOptions(0); $('selectTurno').value='TODOS'; $('divCustomHora').hidden=true; }
    let tmr = null;
    function onRadius() {
      $('lblRaio').textContent = km(radius());
      clearTimeout(tmr);
      tmr = setTimeout(() => { if (RESULT) { recluster(false); if (tab==='trecho') renderPanel(); } }, 120);
    }
    LEVELS.forEach((l,i) => $(SEL[l]).addEventListener('change', () => refreshOptions(i)));
    $('rangeRaio').addEventListener('input', onRadius);
    $('rangeRaio').addEventListener('change', () => { if (RESULT) buildRoute(); });
    $('selectTurno').addEventListener('change', e => { $('divCustomHora').hidden = e.target.value !== 'CUSTOM'; });
    ['chkGravidade','chkRecente','selJanela'].forEach(id => $(id).addEventListener('change', () => { if (RESULT) { recluster(true); } }));
    ['selectPontos','selectKm','selectOrigem'].forEach(id => $(id).addEventListener('change', () => {
      if (id==='selectOrigem' && $(id).value==='GPS' && GPS.watch===null) toggleGps();
      if (RESULT) buildRoute();
    }));
    $('btnGerar').addEventListener('click', processRoute);
    $('btnLimpar').addEventListener('click', clearFilters);
    $('btnGps').addEventListener('click', toggleGps);
    $('btnFiltros').addEventListener('click', () => $('controls').classList.toggle('collapsed'));
    $('btnPainel').addEventListener('click', () => $('panel').classList.contains('open') ? $('panel').classList.remove('open') : openPanel());
    $('btnFechar').addEventListener('click', () => $('panel').classList.remove('open'));
    document.querySelectorAll('[data-tab]').forEach(b => b.addEventListener('click', () => openPanel(b.dataset.tab)));
    window.addEventListener('load', () => {
      buildTicks(); fillHours(); updateAutoLabel(); $('rangeRaio').value = metersToSlider(1000); $('lblRaio').textContent = km(radius());
      if (initMap()) loadFilters(); else $('loadingOverlay').style.display='none';
    });
  </script>
</body>
</html>
