<script>
'use strict';

var STATE = {
  session: null,         // {token, nome, perfil, abas}
  config: null,          // resultado de getAppConfig
  cfgById: {},
  grupoById: {},
  summary: null,
  sheetData: {},         // cache: id -> resultado de getSheetView
  groupData: {},         // cache: id -> resultado de getGroupView
  encarregados: null,
  adminUsers: null,
  filters: {}            // por id: {tipo, unidade, situacao, busca, pendentes, pagina}
};

// ---------- utilidades ----------

function gsRun(fn) {
  var args = Array.prototype.slice.call(arguments, 1);
  return new Promise(function (resolve, reject) {
    google.script.run.withSuccessHandler(resolve).withFailureHandler(reject)[fn].apply(null, args);
  });
}

// como gsRun, mas já injeta o token de sessão como 1º argumento e trata sessão expirada
function gsRunAuth(fn) {
  var args = Array.prototype.slice.call(arguments, 1);
  return gsRun.apply(null, [fn, STATE.session.token].concat(args)).catch(function (err) {
    var msg = err && err.message ? err.message : String(err);
    if (/sess[aã]o/i.test(msg)) {
      fazerLogout(true);
      mostrarMsgLogin('Sua sessão expirou. Faça login novamente.');
    }
    throw err;
  });
}

function esc(s) {
  if (s === null || s === undefined) return '';
  return String(s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}

function fmtDateBR(iso) {
  if (!iso) return null;
  var m = String(iso).match(/^(\d{4})-(\d{2})-(\d{2})/);
  if (m) return m[3] + '/' + m[2] + '/' + m[1];
  return String(iso);
}

function badgeClass(cor) { return 'badge ' + (cor || 'cinza'); }

function kpiCard(n, label, cor) {
  return '<div class="kpi ' + cor + '"><div class="n">' + n + '</div><div class="l">' + esc(label) + '</div></div>';
}

function debounce(fn, ms) {
  var t;
  return function () { var a = arguments; clearTimeout(t); t = setTimeout(function () { fn.apply(null, a); }, ms); };
}

function errorBox(err) {
  return '<div class="error-box">Não foi possível carregar os dados.<br>' + esc(err && err.message ? err.message : err) + '</div>';
}

var charts = {}; // guarda instâncias Chart.js para destruir ao re-renderizar
function destroyCharts() { Object.keys(charts).forEach(function (k) { charts[k].destroy(); }); charts = {}; }

// Chart.js pode não estar disponível ainda (carrega depois do App.html de propósito,
// pra nunca travar o resto do painel se o arquivo do Chart.js falhar). Nesses casos
// os gráficos simplesmente não aparecem, mas tabelas/filtros/menu continuam normais.
function chartDisponivel() { return typeof Chart !== 'undefined'; }
function marcarGraficoIndisponivel(canvasId) {
  var el = document.getElementById(canvasId);
  if (el && el.parentNode) {
    el.parentNode.innerHTML = '<div class="loading" style="height:100%;display:flex;align-items:center;justify-content:center;margin:0;padding:0;">Gráfico indisponível nesta sessão</div>';
  }
}

// =====================================================================
// LOGIN / CADASTRO
// =====================================================================

function mostrarAbaLogin(qual) {
  document.getElementById('tabEntrar').classList.toggle('active', qual === 'entrar');
  document.getElementById('tabCadastrar').classList.toggle('active', qual === 'cadastrar');
  document.getElementById('formEntrar').hidden = qual !== 'entrar';
  document.getElementById('formCadastrar').hidden = qual !== 'cadastrar';
  esconderMsgLogin();
}

function mostrarMsgLogin(texto, tipo) {
  var el = document.getElementById('loginMsg');
  el.textContent = texto;
  el.className = 'login-msg ' + (tipo || 'erro');
  el.hidden = false;
}
function esconderMsgLogin() {
  document.getElementById('loginMsg').hidden = true;
}

function fazerLogin() {
  var pm = document.getElementById('loginPm').value.trim();
  var senha = document.getElementById('loginSenha').value;
  if (!pm || !senha) { mostrarMsgLogin('Informe número PM e senha.'); return; }
  esconderMsgLogin();
  gsRun('login', pm, senha).then(function (res) {
    localStorage.setItem('cpe_token', res.token);
    STATE.session = { token: res.token, nome: res.nome, perfil: res.perfil, abas: res.abas };
    iniciarDashboard();
  }).catch(function (err) { mostrarMsgLogin(err && err.message ? err.message : String(err)); });
}

function fazerCadastro() {
  var pm = document.getElementById('cadPm').value.trim();
  var nome = document.getElementById('cadNome').value.trim();
  var senha = document.getElementById('cadSenha').value;
  var senha2 = document.getElementById('cadSenha2').value;
  if (!pm || !nome || !senha) { mostrarMsgLogin('Preencha todos os campos.'); return; }
  if (senha !== senha2) { mostrarMsgLogin('As senhas não coincidem.'); return; }
  esconderMsgLogin();
  gsRun('registerUser', pm, nome, senha).then(function (res) {
    mostrarAbaLogin('entrar');
    document.getElementById('loginPm').value = pm;
    mostrarMsgLogin(
      res.autoAprovado ? 'Cadastro de administrador criado com sucesso! Faça login.' : 'Cadastro enviado! Aguarde a aprovação do administrador para acessar.',
      'ok'
    );
  }).catch(function (err) { mostrarMsgLogin(err && err.message ? err.message : String(err)); });
}

function fazerLogout(silencioso) {
  var token = STATE.session && STATE.session.token;
  localStorage.removeItem('cpe_token');
  STATE.session = null;
  STATE.config = null;
  if (token) gsRun('logout', token).catch(function () {});
  document.getElementById('dashboard-shell').hidden = true;
  document.getElementById('login-screen').hidden = false;
  var elSenha = document.getElementById('loginSenha');
  if (elSenha) elSenha.value = '';
  if (!silencioso) mostrarMsgLogin('Sessão encerrada.', 'ok');
}

function renderUserBar() {
  var el = document.getElementById('userInfo');
  el.innerHTML = esc(STATE.session.nome) + ' · ' + (STATE.session.perfil === 'ADMIN' ? 'Administrador' : 'Usuário') +
    ' · <a href="#" onclick="fazerLogout();return false;">Sair</a>';
  el.hidden = false;
}

function iniciarDashboard() {
  document.getElementById('login-screen').hidden = true;
  document.getElementById('dashboard-shell').hidden = false;
  renderUserBar();
  gsRunAuth('getAppConfig').then(function (cfg) {
    STATE.config = cfg;
    STATE.cfgById = {};
    STATE.grupoById = {};
    cfg.sheets.forEach(function (s) { STATE.cfgById[s.id] = s; });
    cfg.grupos.forEach(function (g) { STATE.grupoById[g.id] = g; });
    router();
  }).catch(function (err) {
    document.getElementById('app').innerHTML = errorBox(err);
  });
}

function boot() {
  var token = localStorage.getItem('cpe_token');
  if (!token) return; // fica na tela de login, que já é a visível por padrão
  gsRun('getSessionInfo', token).then(function (info) {
    if (!info || !info.ok) { localStorage.removeItem('cpe_token'); return; }
    STATE.session = { token: token, nome: info.nome, perfil: info.perfil, abas: info.abas };
    iniciarDashboard();
  }).catch(function () { localStorage.removeItem('cpe_token'); });
}

// =====================================================================
// MENU SUSPENSO (topo esquerdo)
// =====================================================================

function itensMenu_() {
  var itens = [];
  (STATE.config.sheets || []).forEach(function (s) { itens.push({ isGroup: false, id: s.id, title: s.title, category: s.category }); });
  (STATE.config.grupos || []).forEach(function (g) { itens.push({ isGroup: true, id: g.id, title: g.title, category: g.category }); });
  if (STATE.config.temEncarregados) itens.push({ isGroup: false, id: 'ENCARREGADOS', title: 'Encarregados', category: 'Disciplinar', especial: true });
  return itens;
}

function renderTopbar() {
  var hash = location.hash || '#/';
  var itens = itensMenu_();

  var menuHtml = '<a class="menu-item' + (hash === '#/' || hash === '' ? ' active' : '') + '" href="#/">📊 Visão Geral</a>';

  STATE.config.categories.forEach(function (cat) {
    var doCat = itens.filter(function (it) { return it.category === cat; });
    if (!doCat.length) return;
    menuHtml += '<div class="menu-cat">' + esc(cat) + '</div>';
    doCat.forEach(function (it) {
      var target = it.especial ? '#/encarregados' : (it.isGroup ? '#/grupo/' : '#/aba/') + encodeURIComponent(it.id);
      menuHtml += '<a class="menu-item' + (hash === target ? ' active' : '') + '" href="' + target + '">' + esc(it.title) + '</a>';
    });
  });

  if (STATE.session.perfil === 'ADMIN') {
    menuHtml += '<div class="menu-cat">Administração</div>';
    menuHtml += '<a class="menu-item' + (hash === '#/admin' ? ' active' : '') + '" href="#/admin">⚙️ Gerenciar acessos</a>';
  }

  document.getElementById('menuDropdown').innerHTML = menuHtml;

  var tituloAtual = '📊 Visão Geral';
  if (hash === '#/admin') tituloAtual = '⚙️ Administração';
  else if (hash === '#/encarregados') tituloAtual = 'Encarregados';
  else if (hash.indexOf('#/grupo/') === 0) {
    var gid = decodeURIComponent(hash.replace('#/grupo/', ''));
    if (STATE.grupoById[gid]) tituloAtual = STATE.grupoById[gid].title;
  } else if (hash.indexOf('#/aba/') === 0) {
    var id = decodeURIComponent(hash.replace('#/aba/', ''));
    if (STATE.cfgById[id]) tituloAtual = STATE.cfgById[id].title;
  }
  document.getElementById('menuAtual').textContent = tituloAtual;
}

function toggleMenu() { document.getElementById('menuDropdown').classList.toggle('open'); }
function fecharMenu() { document.getElementById('menuDropdown').classList.remove('open'); }
document.addEventListener('click', function (e) {
  var wrap = document.getElementById('menuWrap');
  if (wrap && !wrap.contains(e.target)) fecharMenu();
});

// ---------- roteador ----------

function router() {
  if (!STATE.session || !STATE.config) return; // ainda não logado / config não carregada
  var hash = location.hash || '#/';
  destroyCharts();
  fecharModal();
  fecharMenu();
  renderTopbar();
  if (hash === '#/' || hash === '') {
    renderHome();
  } else if (hash === '#/encarregados') {
    if (!STATE.config.temEncarregados) { location.hash = '#/'; return; }
    renderEncarregadosView();
  } else if (hash === '#/admin') {
    if (STATE.session.perfil !== 'ADMIN') { location.hash = '#/'; return; }
    renderAdminView();
  } else if (hash.indexOf('#/grupo/') === 0) {
    var gid = decodeURIComponent(hash.replace('#/grupo/', ''));
    if (STATE.grupoById[gid]) renderGroupView(gid); else location.hash = '#/';
  } else if (hash.indexOf('#/aba/') === 0) {
    var id = decodeURIComponent(hash.replace('#/aba/', ''));
    if (STATE.cfgById[id]) renderSheetView(id); else location.hash = '#/';
  } else {
    renderHome();
  }
}
window.addEventListener('hashchange', router);

function atualizarTudo() {
  var hash = location.hash || '#/';
  if (hash.indexOf('#/aba/') === 0) {
    var id = decodeURIComponent(hash.replace('#/aba/', ''));
    delete STATE.sheetData[id];
  } else if (hash.indexOf('#/grupo/') === 0) {
    var gid = decodeURIComponent(hash.replace('#/grupo/', ''));
    delete STATE.groupData[gid];
  } else if (hash === '#/encarregados') {
    STATE.encarregados = null;
  } else if (hash === '#/admin') {
    STATE.adminUsers = null;
  } else {
    STATE.sheetData = {};
    STATE.groupData = {};
    STATE.encarregados = null;
    STATE.summary = null;
  }
  router();
}

// ---------- HOME ----------

function renderHome() {
  var app = document.getElementById('app');
  app.innerHTML = '<div class="loading">Carregando resumo…</div>';

  gsRunAuth('getHomeSummary').then(function (summary) {
    STATE.summary = summary;
    drawHome(summary);
  }).catch(function (err) { app.innerHTML = errorBox(err); });

  // se já tem um resumo em cache (navegação de volta pra Home), pinta na hora;
  // senão fica com "Carregando resumo…" até a chamada acima responder
  if (STATE.summary) drawHome(STATE.summary);
}

function itemBadges_(s) {
  return '<span class="badge azul">' + s.counts.total + ' total</span>' +
    (s.counts.FINALIZADO ? '<span class="badge verde">' + s.counts.FINALIZADO + ' finalizado</span>' : '') +
    (s.counts['EM ANDAMENTO'] ? '<span class="badge azul">' + s.counts['EM ANDAMENTO'] + ' em andamento</span>' : '') +
    (s.counts.ATRASADO ? '<span class="badge vermelho">' + s.counts.ATRASADO + ' atrasado</span>' : '') +
    (s.counts.error ? '<span class="badge cinza">erro ao ler aba</span>' : '');
}

function drawHome(summary) {
  destroyCharts();
  var totals = { total: 0, FINALIZADO: 0, ATRASADO: 0, 'EM ANDAMENTO': 0, OUTROS: 0 };
  var byCat = {};
  summary.forEach(function (s) {
    ['total', 'FINALIZADO', 'ATRASADO', 'EM ANDAMENTO', 'OUTROS'].forEach(function (k) { totals[k] += s.counts[k] || 0; });
    byCat[s.category] = byCat[s.category] || { total: 0, FINALIZADO: 0, ATRASADO: 0, 'EM ANDAMENTO': 0, items: [] };
    byCat[s.category].total += s.counts.total || 0;
    byCat[s.category].FINALIZADO += s.counts.FINALIZADO || 0;
    byCat[s.category].ATRASADO += s.counts.ATRASADO || 0;
    byCat[s.category]['EM ANDAMENTO'] += s.counts['EM ANDAMENTO'] || 0;
    byCat[s.category].items.push(s);
  });

  if (!summary.length) {
    document.getElementById('app').innerHTML = '<div class="empty-state">Você ainda não tem nenhuma aba liberada. Procure o administrador do painel.</div>';
    return;
  }

  var html = '';
  html += '<div class="kpi-row">';
  html += kpiCard(totals.total, 'Registros no painel', 'azul');
  html += kpiCard(totals.FINALIZADO, 'Finalizados', 'verde');
  html += kpiCard(totals['EM ANDAMENTO'], 'Em andamento', 'azul');
  html += kpiCard(totals.ATRASADO, 'Atrasados / atenção', 'vermelho');
  html += '</div>';

  html += '<div class="chart-grid">';
  html += '<div class="chart-card"><h2>Situação por categoria</h2><div class="chart-wrap"><canvas id="chartCategorias"></canvas></div></div>';
  html += '<div class="chart-card"><h2>Distribuição geral</h2><div class="chart-wrap"><canvas id="chartGeral"></canvas></div></div>';
  html += '</div>';

  STATE.config.categories.forEach(function (cat) {
    var c = byCat[cat];
    var mostrarEncarregados = cat === 'Disciplinar' && STATE.config.temEncarregados;
    if (!c && !mostrarEncarregados) return;
    html += '<div class="categoria"><h2>' + esc(cat) + '</h2><div class="cards">';
    if (c) {
      c.items.forEach(function (s) {
        var target = (s.isGroup ? '#/grupo/' : '#/aba/') + encodeURIComponent(s.id);
        html += '<a class="card" href="' + target + '">' +
          '<h3>' + esc(s.title) + '</h3>' +
          '<p>' + esc(s.description || '') + '</p>' +
          '<div class="badges">' + itemBadges_(s) + '</div></a>';
      });
    }
    if (mostrarEncarregados) {
      html += '<a class="card" href="#/encarregados"><h3>Encarregados</h3>' +
        '<p>Escalas de Conselho de Justiça, indicados CPM e controle de processos entregues.</p>' +
        '<div class="badges"><span class="badge azul">ver painel</span></div></a>';
    }
    html += '</div></div>';
  });

  document.getElementById('app').innerHTML = html;

  if (!chartDisponivel()) {
    marcarGraficoIndisponivel('chartCategorias');
    marcarGraficoIndisponivel('chartGeral');
    return;
  }

  var catLabels = STATE.config.categories.filter(function (c) { return byCat[c]; });
  charts.cat = new Chart(document.getElementById('chartCategorias'), {
    type: 'bar',
    data: {
      labels: catLabels,
      datasets: [
        { label: 'Finalizado', data: catLabels.map(function (c) { return byCat[c].FINALIZADO; }), backgroundColor: '#1f9d55' },
        { label: 'Em andamento', data: catLabels.map(function (c) { return byCat[c]['EM ANDAMENTO']; }), backgroundColor: '#2563a8' },
        { label: 'Atrasado', data: catLabels.map(function (c) { return byCat[c].ATRASADO; }), backgroundColor: '#d64545' }
      ]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      scales: { x: { stacked: true }, y: { stacked: true, beginAtZero: true } },
      plugins: { legend: { position: 'bottom' } }
    }
  });

  charts.geral = new Chart(document.getElementById('chartGeral'), {
    type: 'doughnut',
    data: {
      labels: ['Finalizado', 'Em andamento', 'Atrasado', 'Outros'],
      datasets: [{ data: [totals.FINALIZADO, totals['EM ANDAMENTO'], totals.ATRASADO, totals.OUTROS],
        backgroundColor: ['#1f9d55', '#2563a8', '#d64545', '#9aa3af'] }]
    },
    options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'bottom' } } }
  });
}

// ---------- VISÃO DE ABA (avulsa) ----------

function renderSheetView(id) {
  var cfg = STATE.cfgById[id];
  var app = document.getElementById('app');
  app.innerHTML = '<div class="loading">Carregando "' + esc(cfg.title) + '"…</div>';

  STATE.filters[id] = STATE.filters[id] || { unidade: '', situacao: '', busca: '', pendentes: false, pagina: 1 };

  var p = STATE.sheetData[id] ? Promise.resolve(STATE.sheetData[id]) : gsRunAuth('getSheetView', id);
  p.then(function (data) {
    STATE.sheetData[id] = data;
    drawSheetView(id, data);
  }).catch(function (err) { app.innerHTML = errorBox(err); });
}

function distinctValues_(rows, key) {
  var set = {};
  rows.forEach(function (r) { var v = r[key]; if (v) set[String(v).trim()] = true; });
  return Object.keys(set).sort();
}

function applyFilters_(id, data) {
  var f = STATE.filters[id];
  var roles = data.roles;
  return data.rows.filter(function (r) {
    if (f.unidade && roles.unit && String(r[roles.unit] || '').trim() !== f.unidade) return false;
    if (f.situacao && r._situacao !== f.situacao) return false;
    if (f.pendentes && r._situacao === 'FINALIZADO') return false;
    if (f.busca) {
      var alvo = data.columns.map(function (c) { return r[c.key]; }).concat([r._situacao]).join(' | ').toUpperCase();
      if (alvo.indexOf(f.busca.toUpperCase()) === -1) return false;
    }
    return true;
  });
}

function drawSheetView(id, data) {
  destroyCharts();
  var f = STATE.filters[id];
  var roles = data.roles;
  var listCols = data.columns.filter(function (c) { return c.list; });

  var unidades = roles.unit ? distinctValues_(data.rows, roles.unit) : [];
  var situacoes = distinctValues_(data.rows, '_situacao');

  var filtered = applyFilters_(id, data);

  var html = '';
  html += '<div class="view-header"><div><h1>' + esc(data.title) + '</h1><p>' + esc(data.description || '') + '</p></div>' +
    '<button class="btn small" onclick="atualizarTudo()">↻ Atualizar</button></div>';

  html += '<div class="toolbar">';
  if (unidades.length) {
    html += '<div class="grp"><label>Unidade</label><select id="f-unidade"><option value="">Todas</option>' +
      unidades.map(function (u) { return '<option ' + (u === f.unidade ? 'selected' : '') + '>' + esc(u) + '</option>'; }).join('') +
      '</select></div>';
  }
  if (situacoes.length > 1) {
    html += '<div class="grp"><label>Situação</label><select id="f-situacao"><option value="">Todas</option>' +
      situacoes.map(function (s) { return '<option ' + (s === f.situacao ? 'selected' : '') + '>' + esc(s) + '</option>'; }).join('') +
      '</select></div>';
  }
  html += '<div class="grp"><label>Buscar</label><input id="f-busca" type="text" placeholder="texto, SICOR, nome…" value="' + esc(f.busca) + '"></div>';
  html += '<div class="grp chk"><label><input type="checkbox" id="f-pendentes" ' + (f.pendentes ? 'checked' : '') + '> Somente pendentes</label></div>';
  html += '<div class="spacer"></div>';
  html += '<div class="count">' + filtered.length + ' de ' + data.rows.length + ' registros</div>';
  html += '</div>';

  if (filtered.length === 0) {
    html += '<div class="empty-state">Nenhum registro encontrado com os filtros atuais.</div>';
    document.getElementById('app').innerHTML = html;
    bindToolbar_(id, data);
    return;
  }

  html += '<div class="chart-grid">' +
    '<div class="chart-card"><h2>Situação (registros filtrados)</h2><div class="chart-wrap"><canvas id="chartSituacao"></canvas></div></div>' +
    (roles.unit ? '<div class="chart-card"><h2>Top unidades</h2><div class="chart-wrap"><canvas id="chartUnidade"></canvas></div></div>' : '') +
    '</div>';

  var porPagina = 40;
  var totalPaginas = Math.max(1, Math.ceil(filtered.length / porPagina));
  if (f.pagina > totalPaginas) f.pagina = totalPaginas;
  var inicio = (f.pagina - 1) * porPagina;
  var pageRows = filtered.slice(inicio, inicio + porPagina);

  html += '<div style="overflow-x:auto"><table><thead><tr><th>Situação</th>' +
    listCols.map(function (c) { return '<th>' + esc(c.header) + '</th>'; }).join('') + '</tr></thead><tbody>';
  pageRows.forEach(function (r) {
    html += '<tr onclick="abrirModal(\'' + id + '\',' + r._row + ')"><td><span class="' + badgeClass(r._situacaoCor) + '">' + esc(r._situacao) + '</span></td>';
    listCols.forEach(function (c) {
      var v = r[c.key];
      var display = c.type === 'date' ? (fmtDateBR(v) || '—') : (v || '—');
      html += '<td class="cell-trunc" title="' + esc(v || '') + '">' + esc(display) + '</td>';
    });
    html += '</tr>';
  });
  html += '</tbody></table></div>';

  html += '<div class="pager">' +
    '<button class="btn small" ' + (f.pagina <= 1 ? 'disabled' : '') + ' onclick="mudarPagina(\'' + id + '\',-1)">‹ Anterior</button>' +
    '<span>Página ' + f.pagina + ' de ' + totalPaginas + '</span>' +
    '<button class="btn small" ' + (f.pagina >= totalPaginas ? 'disabled' : '') + ' onclick="mudarPagina(\'' + id + '\',1)">Próxima ›</button>' +
    '</div>';

  document.getElementById('app').innerHTML = html;
  bindToolbar_(id, data);

  if (!chartDisponivel()) {
    marcarGraficoIndisponivel('chartSituacao');
    if (roles.unit) marcarGraficoIndisponivel('chartUnidade');
    return;
  }

  var sitCounts = {};
  filtered.forEach(function (r) { sitCounts[r._situacao] = (sitCounts[r._situacao] || 0) + 1; });
  var sitLabels = Object.keys(sitCounts);
  var corPorSituacao = { FINALIZADO: '#1f9d55', ATRASADO: '#d64545', 'EM ANDAMENTO': '#2563a8', 'SEM STATUS': '#9aa3af' };
  charts.situacao = new Chart(document.getElementById('chartSituacao'), {
    type: 'doughnut',
    data: { labels: sitLabels, datasets: [{ data: sitLabels.map(function (s) { return sitCounts[s]; }),
      backgroundColor: sitLabels.map(function (s) { return corPorSituacao[s] || '#c98a11'; }) }] },
    options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'bottom' } } }
  });

  if (roles.unit) {
    var uCounts = {};
    filtered.forEach(function (r) { var u = r[roles.unit] || 'Não informado'; uCounts[u] = (uCounts[u] || 0) + 1; });
    var top = Object.keys(uCounts).map(function (k) { return [k, uCounts[k]]; }).sort(function (a, b) { return b[1] - a[1]; }).slice(0, 8);
    charts.unidade = new Chart(document.getElementById('chartUnidade'), {
      type: 'bar',
      data: { labels: top.map(function (t) { return t[0]; }), datasets: [{ label: 'Registros', data: top.map(function (t) { return t[1]; }), backgroundColor: '#2563a8' }] },
      options: { indexAxis: 'y', responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { x: { beginAtZero: true } } }
    });
  }
}

function bindToolbar_(id, data) {
  var f = STATE.filters[id];
  var elU = document.getElementById('f-unidade');
  var elS = document.getElementById('f-situacao');
  var elB = document.getElementById('f-busca');
  var elP = document.getElementById('f-pendentes');
  if (elU) elU.addEventListener('change', function () { f.unidade = this.value; f.pagina = 1; drawSheetView(id, data); });
  if (elS) elS.addEventListener('change', function () { f.situacao = this.value; f.pagina = 1; drawSheetView(id, data); });
  if (elP) elP.addEventListener('change', function () { f.pendentes = this.checked; f.pagina = 1; drawSheetView(id, data); });
  if (elB) elB.addEventListener('input', debounce(function () { f.busca = this.value; f.pagina = 1; drawSheetView(id, data); }, 250));
}

// ---------- VISÃO DE GRUPO (várias abas unidas + filtro de Tipo) ----------

function renderGroupView(id) {
  var grupo = STATE.grupoById[id];
  var app = document.getElementById('app');
  app.innerHTML = '<div class="loading">Carregando "' + esc(grupo.title) + '"…</div>';

  STATE.filters[id] = STATE.filters[id] || { tipo: '', unidade: '', situacao: '', busca: '', pendentes: false, pagina: 1 };

  var p = STATE.groupData[id] ? Promise.resolve(STATE.groupData[id]) : gsRunAuth('getGroupView', id);
  p.then(function (data) {
    STATE.groupData[id] = data;
    drawGroupView(id, data);
  }).catch(function (err) { app.innerHTML = errorBox(err); });
}

function membroPorTipo_(data, tipo) {
  var arr = data.membros.filter(function (m) { return m.tipo === tipo; });
  return arr[0] || null;
}

function applyFiltersGrupo_(id, data) {
  var f = STATE.filters[id];
  return data.rows.filter(function (r) {
    if (f.tipo && r._tipo !== f.tipo) return false;
    if (f.unidade && String(r._unidadeValor || '').trim() !== f.unidade) return false;
    if (f.situacao && r._situacao !== f.situacao) return false;
    if (f.pendentes && r._situacao === 'FINALIZADO') return false;
    if (f.busca) {
      var membro = membroPorTipo_(data, r._tipo);
      var campos = membro ? membro.columns.map(function (c) { return r[c.key]; }) : [];
      var alvo = campos.concat([r._situacao, r._tipo]).join(' | ').toUpperCase();
      if (alvo.indexOf(f.busca.toUpperCase()) === -1) return false;
    }
    return true;
  });
}

function drawGroupView(id, data) {
  destroyCharts();
  var f = STATE.filters[id];

  var tipos = data.membros.map(function (m) { return m.tipo; });
  var unidades = distinctValues_(data.rows, '_unidadeValor');
  var situacoes = distinctValues_(data.rows, '_situacao');

  var filtered = applyFiltersGrupo_(id, data);

  var html = '';
  html += '<div class="view-header"><div><h1>' + esc(data.title) + '</h1><p>' + esc(data.description || '') + '</p></div>' +
    '<button class="btn small" onclick="atualizarTudo()">↻ Atualizar</button></div>';

  html += '<div class="toolbar">';
  html += '<div class="grp"><label>Tipo</label><select id="f-tipo"><option value="">Todos</option>' +
    tipos.map(function (t) { return '<option ' + (t === f.tipo ? 'selected' : '') + '>' + esc(t) + '</option>'; }).join('') +
    '</select></div>';
  if (unidades.length) {
    html += '<div class="grp"><label>Unidade</label><select id="f-unidade"><option value="">Todas</option>' +
      unidades.map(function (u) { return '<option ' + (u === f.unidade ? 'selected' : '') + '>' + esc(u) + '</option>'; }).join('') +
      '</select></div>';
  }
  if (situacoes.length > 1) {
    html += '<div class="grp"><label>Situação</label><select id="f-situacao"><option value="">Todas</option>' +
      situacoes.map(function (s) { return '<option ' + (s === f.situacao ? 'selected' : '') + '>' + esc(s) + '</option>'; }).join('') +
      '</select></div>';
  }
  html += '<div class="grp"><label>Buscar</label><input id="f-busca" type="text" placeholder="texto, SICOR, nome…" value="' + esc(f.busca) + '"></div>';
  html += '<div class="grp chk"><label><input type="checkbox" id="f-pendentes" ' + (f.pendentes ? 'checked' : '') + '> Somente pendentes</label></div>';
  html += '<div class="spacer"></div>';
  html += '<div class="count">' + filtered.length + ' de ' + data.rows.length + ' registros</div>';
  html += '</div>';

  if (filtered.length === 0) {
    html += '<div class="empty-state">Nenhum registro encontrado com os filtros atuais.</div>';
    document.getElementById('app').innerHTML = html;
    bindToolbarGrupo_(id, data);
    return;
  }

  html += '<div class="chart-grid">' +
    '<div class="chart-card"><h2>Situação (registros filtrados)</h2><div class="chart-wrap"><canvas id="chartSituacao"></canvas></div></div>' +
    '<div class="chart-card"><h2>Por tipo</h2><div class="chart-wrap"><canvas id="chartTipo"></canvas></div></div>' +
    '</div>';

  var porPagina = 40;
  var totalPaginas = Math.max(1, Math.ceil(filtered.length / porPagina));
  if (f.pagina > totalPaginas) f.pagina = totalPaginas;
  var inicio = (f.pagina - 1) * porPagina;
  var pageRows = filtered.slice(inicio, inicio + porPagina);

  html += '<div style="overflow-x:auto"><table><thead><tr><th>Situação</th><th>Tipo</th><th>Data</th><th>Unidade</th><th>Assunto</th></tr></thead><tbody>';
  pageRows.forEach(function (r) {
    html += '<tr onclick="abrirModalGrupo(\'' + id + '\',\'' + r._uid + '\')">' +
      '<td><span class="' + badgeClass(r._situacaoCor) + '">' + esc(r._situacao) + '</span></td>' +
      '<td><span class="badge cinza">' + esc(r._tipo) + '</span></td>' +
      '<td>' + esc(fmtDateBR(r._dataValor) || '—') + '</td>' +
      '<td>' + esc(r._unidadeValor || '—') + '</td>' +
      '<td class="cell-trunc" title="' + esc(r._assuntoValor || '') + '">' + esc(r._assuntoValor || '—') + '</td>' +
      '</tr>';
  });
  html += '</tbody></table></div>';

  html += '<div class="pager">' +
    '<button class="btn small" ' + (f.pagina <= 1 ? 'disabled' : '') + ' onclick="mudarPagina(\'' + id + '\',-1)">‹ Anterior</button>' +
    '<span>Página ' + f.pagina + ' de ' + totalPaginas + '</span>' +
    '<button class="btn small" ' + (f.pagina >= totalPaginas ? 'disabled' : '') + ' onclick="mudarPagina(\'' + id + '\',1)">Próxima ›</button>' +
    '</div>';

  document.getElementById('app').innerHTML = html;
  bindToolbarGrupo_(id, data);

  if (!chartDisponivel()) {
    marcarGraficoIndisponivel('chartSituacao');
    marcarGraficoIndisponivel('chartTipo');
    return;
  }

  var sitCounts = {};
  filtered.forEach(function (r) { sitCounts[r._situacao] = (sitCounts[r._situacao] || 0) + 1; });
  var sitLabels = Object.keys(sitCounts);
  var corPorSituacao = { FINALIZADO: '#1f9d55', ATRASADO: '#d64545', 'EM ANDAMENTO': '#2563a8', 'SEM STATUS': '#9aa3af' };
  charts.situacao = new Chart(document.getElementById('chartSituacao'), {
    type: 'doughnut',
    data: { labels: sitLabels, datasets: [{ data: sitLabels.map(function (s) { return sitCounts[s]; }),
      backgroundColor: sitLabels.map(function (s) { return corPorSituacao[s] || '#c98a11'; }) }] },
    options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'bottom' } } }
  });

  var tipoCounts = {};
  filtered.forEach(function (r) { tipoCounts[r._tipo] = (tipoCounts[r._tipo] || 0) + 1; });
  var tipoLabels = Object.keys(tipoCounts);
  charts.tipo = new Chart(document.getElementById('chartTipo'), {
    type: 'bar',
    data: { labels: tipoLabels, datasets: [{ label: 'Registros', data: tipoLabels.map(function (t) { return tipoCounts[t]; }), backgroundColor: '#A08F63' }] },
    options: { indexAxis: 'y', responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { x: { beginAtZero: true } } }
  });
}

function bindToolbarGrupo_(id, data) {
  var f = STATE.filters[id];
  var elT = document.getElementById('f-tipo');
  var elU = document.getElementById('f-unidade');
  var elS = document.getElementById('f-situacao');
  var elB = document.getElementById('f-busca');
  var elP = document.getElementById('f-pendentes');
  if (elT) elT.addEventListener('change', function () { f.tipo = this.value; f.pagina = 1; drawGroupView(id, data); });
  if (elU) elU.addEventListener('change', function () { f.unidade = this.value; f.pagina = 1; drawGroupView(id, data); });
  if (elS) elS.addEventListener('change', function () { f.situacao = this.value; f.pagina = 1; drawGroupView(id, data); });
  if (elP) elP.addEventListener('change', function () { f.pendentes = this.checked; f.pagina = 1; drawGroupView(id, data); });
  if (elB) elB.addEventListener('input', debounce(function () { f.busca = this.value; f.pagina = 1; drawGroupView(id, data); }, 250));
}

// mudarPagina() serve tanto pra aba avulsa quanto pra grupo — decide olhando o cache
function mudarPagina(id, delta) {
  STATE.filters[id].pagina += delta;
  if (STATE.grupoById[id]) drawGroupView(id, STATE.groupData[id]);
  else drawSheetView(id, STATE.sheetData[id]);
}

// ---------- MODAL ----------

function abrirModal(id, rowIndex) {
  var data = STATE.sheetData[id];
  var cfg = STATE.cfgById[id];
  var row = data.rows.filter(function (r) { return r._row === rowIndex; })[0];
  if (!row) return;
  document.getElementById('modal-title').innerHTML = esc(cfg.title) + ' — <span class="' + badgeClass(row._situacaoCor) + '">' + esc(row._situacao) + '</span>';
  var body = data.columns.map(function (c) {
    var v = row[c.key];
    var display = v ? (c.type === 'date' ? fmtDateBR(v) : v) : '—';
    return '<div class="field"><div class="k">' + esc(c.header) + '</div><div class="v">' + esc(display) + '</div></div>';
  }).join('');
  document.getElementById('modal-body').innerHTML = body;
  document.getElementById('modal-backdrop').classList.add('open');
}

function abrirModalGrupo(id, uid) {
  var data = STATE.groupData[id];
  var row = data.rows.filter(function (r) { return r._uid === uid; })[0];
  if (!row) return;
  var membro = membroPorTipo_(data, row._tipo);
  document.getElementById('modal-title').innerHTML = esc(data.title) + ' · ' + esc(row._tipo) +
    ' — <span class="' + badgeClass(row._situacaoCor) + '">' + esc(row._situacao) + '</span>';
  var cols = membro ? membro.columns : [];
  var body = cols.map(function (c) {
    var v = row[c.key];
    var display = v ? (c.type === 'date' ? fmtDateBR(v) : v) : '—';
    return '<div class="field"><div class="k">' + esc(c.header) + '</div><div class="v">' + esc(display) + '</div></div>';
  }).join('');
  document.getElementById('modal-body').innerHTML = body;
  document.getElementById('modal-backdrop').classList.add('open');
}

function fecharModal() { document.getElementById('modal-backdrop').classList.remove('open'); }
document.addEventListener('keydown', function (e) { if (e.key === 'Escape') fecharModal(); });

// ---------- ENCARREGADOS ----------

function renderEncarregadosView() {
  var app = document.getElementById('app');
  app.innerHTML = '<div class="loading">Carregando…</div>';

  var p = STATE.encarregados ? Promise.resolve(STATE.encarregados) : gsRunAuth('getEncarregadosView');
  p.then(function (data) {
    STATE.encarregados = data;
    var html = '<div class="view-header"><div><h1>' + esc(data.title) + '</h1>' +
      '<p>Escalas do Conselho de Justiça, indicados para CPM e controle de processos entregues aos encarregados.</p></div>' +
      '<button class="btn small" onclick="atualizarTudo()">↻ Atualizar</button></div>';
    data.blocks.forEach(function (b) {
      html += '<div class="encarregados-block"><h3>' + esc(b.heading) + '</h3>' +
        (b.subLabel ? '<div class="sub">' + esc(b.subLabel) + '</div>' : '');
      if (!b.rows.length) {
        html += '<div class="sub">Sem registros nesta escala.</div></div>';
        return;
      }
      html += '<div style="overflow-x:auto"><table><thead><tr>' +
        b.header.map(function (h) { return '<th>' + esc(h) + '</th>'; }).join('') + '</tr></thead><tbody>';
      b.rows.forEach(function (r) {
        html += '<tr>' + b.header.map(function (h) {
          var v = r[h];
          var display = (v && String(v).match(/^\d{4}-\d{2}-\d{2}T/)) ? fmtDateBR(v) : (v || '—');
          return '<td>' + esc(display) + '</td>';
        }).join('') + '</tr>';
      });
      html += '</tbody></table></div></div>';
    });
    app.innerHTML = html;
  }).catch(function (err) { app.innerHTML = errorBox(err); });
}

// ---------- ADMINISTRAÇÃO (só perfil ADMIN) ----------

function tabsParaAdmin_() {
  var itens = [];
  (STATE.config.sheets || []).forEach(function (s) { itens.push({ id: s.id, title: s.title }); });
  (STATE.config.grupos || []).forEach(function (g) { itens.push({ id: g.id, title: g.title }); });
  if (STATE.config.temEncarregados) itens.push({ id: 'ENCARREGADOS', title: 'Encarregados' });
  return itens;
}

function statusBadgeCor_(status) {
  if (status === 'APROVADO') return 'verde';
  if (status === 'BLOQUEADO') return 'vermelho';
  return 'amarelo';
}

function idAdminCard_(numeroPm) { return 'u_' + String(numeroPm).replace(/[^a-zA-Z0-9]/g, '_'); }

function renderAdminView() {
  var app = document.getElementById('app');
  app.innerHTML = '<div class="loading">Carregando usuários…</div>';
  gsRunAuth('adminListUsers').then(function (users) {
    STATE.adminUsers = users;
    drawAdminView(users);
  }).catch(function (err) { app.innerHTML = errorBox(err); });
}

function drawAdminView(users) {
  destroyCharts();
  var tabs = tabsParaAdmin_();

  var pendentes = users.filter(function (u) { return u.status === 'PENDENTE'; }).length;
  var html = '<div class="view-header"><div><h1>Administração de acesso</h1>' +
    '<p>Aprove cadastros e escolha quais abas cada usuário pode visualizar.' +
    (pendentes ? ' <strong>' + pendentes + ' cadastro(s) pendente(s).</strong>' : '') + '</p></div>' +
    '<button class="btn small" onclick="renderAdminView()">↻ Atualizar</button></div>';

  if (!users.length) {
    html += '<div class="empty-state">Nenhum usuário cadastrado ainda.</div>';
    document.getElementById('app').innerHTML = html;
    return;
  }

  html += '<div class="admin-list">';
  users.forEach(function (u) {
    var uid = idAdminCard_(u.numeroPm);
    var todasMarcado = u.abas === 'TODAS';
    var abasSelecionadas = todasMarcado ? tabs.map(function (t) { return t.id; }) :
      String(u.abas || '').split(',').map(function (s) { return s.trim(); }).filter(Boolean);

    html += '<div class="admin-card" id="' + uid + '">';
    html += '<div class="admin-card-head"><div><strong>' + esc(u.nome) + '</strong>' +
      '<span class="admin-pm">Nº PM ' + esc(u.numeroPm) + '</span></div>' +
      '<span class="' + badgeClass(statusBadgeCor_(u.status)) + '">' + esc(u.status) + '</span></div>';

    html += '<div class="admin-row">';
    html += '<div class="grp"><label>Perfil</label><select class="adm-perfil">' +
      '<option value="USUARIO"' + (u.perfil === 'USUARIO' ? ' selected' : '') + '>Usuário</option>' +
      '<option value="ADMIN"' + (u.perfil === 'ADMIN' ? ' selected' : '') + '>Administrador</option>' +
      '</select></div>';
    html += '<div class="grp"><label>Status</label><select class="adm-status">' +
      '<option value="PENDENTE"' + (u.status === 'PENDENTE' ? ' selected' : '') + '>Pendente</option>' +
      '<option value="APROVADO"' + (u.status === 'APROVADO' ? ' selected' : '') + '>Aprovado</option>' +
      '<option value="BLOQUEADO"' + (u.status === 'BLOQUEADO' ? ' selected' : '') + '>Bloqueado</option>' +
      '</select></div>';
    html += '</div>';

    html += '<div class="admin-abas"><label class="chk"><input type="checkbox" class="adm-todas"' + (todasMarcado ? ' checked' : '') + '> Todas as abas</label>';
    html += '<div class="admin-abas-grid"' + (todasMarcado ? ' style="display:none"' : '') + '>';
    tabs.forEach(function (t) {
      html += '<label class="chk"><input type="checkbox" class="adm-aba" value="' + esc(t.id) + '"' +
        (abasSelecionadas.indexOf(t.id) !== -1 ? ' checked' : '') + '> ' + esc(t.title) + '</label>';
    });
    html += '</div></div>';

    html += '<div class="admin-actions"><button class="btn small" onclick="salvarPermissao(\'' + esc(u.numeroPm).replace(/'/g, "\\'") + '\')">Salvar</button>' +
      '<span class="admin-save-msg" id="' + uid + '_msg"></span></div>';
    html += '</div>';
  });
  html += '</div>';

  document.getElementById('app').innerHTML = html;

  users.forEach(function (u) {
    var card = document.getElementById(idAdminCard_(u.numeroPm));
    if (!card) return;
    var chkTodas = card.querySelector('.adm-todas');
    var grid = card.querySelector('.admin-abas-grid');
    chkTodas.addEventListener('change', function () { grid.style.display = this.checked ? 'none' : ''; });
  });
}

function salvarPermissao(numeroPm) {
  var uid = idAdminCard_(numeroPm);
  var card = document.getElementById(uid);
  if (!card) return;
  var perfil = card.querySelector('.adm-perfil').value;
  var status = card.querySelector('.adm-status').value;
  var todas = card.querySelector('.adm-todas').checked;
  var abas = todas ? 'TODAS' : Array.prototype.slice.call(card.querySelectorAll('.adm-aba:checked')).map(function (el) { return el.value; }).join(',');
  var msgEl = document.getElementById(uid + '_msg');
  if (msgEl) msgEl.textContent = 'Salvando…';
  gsRunAuth('adminSetPermissao', numeroPm, status, perfil, abas).then(function () {
    if (msgEl) msgEl.textContent = 'Salvo ✓';
  }).catch(function (err) {
    if (msgEl) msgEl.textContent = '';
    alert('Erro ao salvar: ' + (err && err.message ? err.message : err));
  });
}

// ---------- boot ----------

function tickClock() {
  var d = new Date();
  var el = document.getElementById('clock');
  if (el) el.textContent = 'Sincronizado: ' + d.toLocaleDateString('pt-BR') + ' ' + d.toLocaleTimeString('pt-BR');
}
setInterval(tickClock, 1000);
tickClock();
boot();
</script>
